Some tasks were dull and repetitive, while others caused him enough headaches to make him question his career choice.|كانت بعض المهام مملة ومتكررة، بينما سببت له أخرى من الصداع ما يكفي ليشكك في اختياره لمهنته.|tasks=مهام؛ dull=ممل، رتيب؛ repetitive=متكرر؛ headaches=صداع، متاعب؛ question=يشكك في، يتساءل عن؛ career=مهنة، مسار وظيفي
Besides his daily responsibilities, he had to deal with excessive workloads and constant pressure.|إلى جانب مسؤولياته اليومية، كان عليه التعامل مع أعباء عمل مفرطة وضغط مستمر.|besides=إلى جانب، فضلًا عن؛ deal with=يتعامل مع؛ excessive=مفرط، زائد عن الحد؛ workloads=أعباء العمل؛ constant=مستمر، دائم؛ pressure=ضغط
He sometimes had misgivings about his future.|كانت تراوده أحيانًا مخاوف وشكوك حيال مستقبله.|misgivings=مخاوف، شكوك، توجّس
He feared that he might spend his entire lifetime working for a company without achieving anything meaningful of his own.|خشي أن يقضي حياته كلها يعمل لدى شركة دون أن يحقق شيئًا ذا معنى لنفسه.|feared=يخشى؛ entire=كامل، بأكمله؛ lifetime=عمر، مدى الحياة

One day, a financial crisis struck the company.|في يوم ما، ضربت أزمة مالية الشركة.|crisis=أزمة؛ struck=ضرب، أصاب
It began to suffer losses, and its profits decreased day by day.|بدأت تتكبد خسائر، وتراجعت أرباحها يومًا بعد يوم.|losses=خسائر؛ decreased=تناقص، انخفض؛ day by day=يومًا بعد يوم
Consequently, the company was no longer able to operate as efficiently as before.|ونتيجة لذلك، لم تعد الشركة قادرة على العمل بكفاءة كما كانت.|consequently=نتيجة لذلك، بالتالي؛ no longer=لم يعد؛ operate=يعمل، يُشغّل؛ efficiently=بكفاءة
The management tried to reduce costs, but the situation continued to deteriorate.|حاولت الإدارة خفض التكاليف، لكن الوضع استمر في التدهور.|management=الإدارة؛ reduce=يخفض، يقلل؛ deteriorate=يتدهور، يسوء
Eventually, the company had to lay off several employees.|وفي النهاية، اضطرت الشركة إلى تسريح عدة موظفين.|lay off=يسرّح، يفصل من العمل
Everyone feared that it might go bankrupt and close down completely.|خشي الجميع أن تفلس وتُغلق تمامًا.|go bankrupt=يفلس؛ close down=يُغلق نهائيًا

Daniel was deeply affected by the news.|تأثر دانيال بعمق بالخبر.|affected=متأثر
He remembered the bygone days when the company had been successful and its employees had enjoyed stable jobs.|تذكّر الأيام الغابرة حين كانت الشركة ناجحة وتمتع موظفوها بوظائف مستقرة.|bygone=غابر، ماضٍ؛ stable=مستقر، ثابت
He began to consider making a strategic decision.|بدأ يفكر في اتخاذ قرار استراتيجي.|strategic=استراتيجي
Instead of waiting for the situation to improve, he decided to establish a small financial consulting business of his own.|بدل انتظار تحسّن الوضع، قرر تأسيس مشروع صغير للاستشارات المالية خاص به.|consulting=استشاري، استشارات

His family worried about the cost and the possibility of failure.|قلقت عائلته من التكلفة ومن احتمال الفشل.|possibility=احتمال، إمكانية؛ failure=فشل
His father reminded him that setbacks and defeats were part of life.|ذكّره أبوه بأن النكسات والهزائم جزء من الحياة.|setbacks=نكسات، عقبات؛ defeats=هزائم
“Success is not simply about making a profit,” his father explained.|“النجاح ليس مجرد تحقيق ربح،” شرح أبوه.|simply=ببساطة، مجرد
“It also means having the willpower to face difficulties and the courage to continue when things go wrong.”|“بل يعني أيضًا امتلاك قوة الإرادة لمواجهة الصعاب والشجاعة للاستمرار حين تسوء الأمور.”|willpower=قوة الإرادة، عزيمة؛ face=يواجه

Daniel deeply regretted the years he had spent doubting himself.|ندم دانيال بشدة على السنوات التي قضاها يشكك في نفسه.|regretted=ندم على؛ doubting=يشك في
He realized that fear should not determine his future.|أدرك أن الخوف لا ينبغي أن يحدد مستقبله.|determine=يحدد، يقرر
He was brave enough to take the risk, although he knew that starting a business would not be easy.|كان شجاعًا بما يكفي ليخوض المخاطرة، مع أنه عرف أن بدء عمل تجاري لن يكون سهلًا.|brave=شجاع؛ take the risk=يخوض المخاطرة، يجازف
He decided to accompany his former colleague, Sarah, who was an expert in marketing and business development.|قرر أن يصاحب زميلته السابقة سارة، وهي خبيرة في التسويق وتطوير الأعمال.|accompany=يرافق، يصاحب؛ marketing=تسويق

Their first challenge was to find a suitable market.|كان تحدّيهما الأول إيجاد سوق مناسبة.|challenge=تحدٍّ؛ suitable=مناسب، ملائم؛ market=سوق
They discovered that financial consulting services were in hot demand, particularly among small businesses struggling to survive.|اكتشفا أن خدمات الاستشارات المالية عليها طلب كبير، خصوصًا بين المشاريع الصغيرة التي تكافح من أجل البقاء.|in hot demand=عليه طلب كبير؛ survive=ينجو، يبقى على قيد الحياة
Many companies were striving to be the first in their industries, competing with each other for the lead.|كانت شركات كثيرة تسعى جاهدة لتكون الأولى في مجالاتها، وتتنافس فيما بينها على الصدارة.|striving=يسعى جاهدًا؛ industries=صناعات، قطاعات؛ competing=ينافس؛ the lead=الصدارة، الريادة
Daniel and Sarah understood that they needed a grand and impressive strategy to stand out.|أدرك دانيال وسارة أنهما بحاجة إلى استراتيجية عظيمة ومبهرة ليتميّزا.|grand=عظيم، فخم؛ stand out=يتميز، يبرز
They worked day and night to develop a service that was after their hearts: honest, affordable, and useful to their clients.|عملا ليل نهار لتطوير خدمة تتوافق مع قلبيهما: صادقة وبأسعار معقولة ومفيدة لعملائهما.|day and night=ليل نهار؛ after one’s heart=يوافق هواه، يرضي قلبه؛ affordable=بسعر معقول، في المتناول

As soon as possible, they registered their business and began looking for customers.|في أسرع وقت ممكن، سجّلا عملهما وبدآ البحث عن زبائن.|as soon as possible=في أسرع وقت ممكن؛ registered=سجّل
Their first few months were difficult, but they gradually attracted more clients.|كانت أشهرهما الأولى صعبة، لكنهما جذبا تدريجيًّا مزيدًا من العملاء.|
Their business began to make a profit.|بدأ عملهما يحقق ربحًا.|
It was finally running smoothly, and their confidence increased day by day.|وأخيرًا صار يسير بسلاسة، وازدادت ثقتهما يومًا بعد يوم.|running smoothly=يسير بسلاسة

Daniel learned that being similar to successful people did not mean copying everything they did.|تعلّم دانيال أن مشابهة الناجحين لا تعني نسخ كل ما يفعلونه.|similar to=مشابه لـ؛ copying=ينسخ، يقلّد
He had to understand what worked for his own business and what did not.|كان عليه أن يفهم ما ينفع عمله الخاص وما لا ينفعه.|
He also learned that opportunity and luck were important, but they were not enough without effort.|وتعلّم أيضًا أن الفرصة والحظ مهمان، لكنهما لا يكفيان دون جهد.|luck=حظ
Besides knowledge and experience, a person needed a strong heart, soul, and willpower.|إلى جانب المعرفة والخبرة، يحتاج المرء قلبًا قويًّا وروحًا وإرادة.|knowledge=معرفة؛ soul=روح

Years later, Daniel looked back on his journey with pride.|بعد سنوات، نظر دانيال إلى رحلته بفخر.|look back on=ينظر إلى الماضي، يستعرض ذكرياته عن؛ pride=فخر
He understood that the crisis that had once frightened him had actually led him to a better future.|أدرك أن الأزمة التي أفزعته يومًا قادته في الحقيقة إلى مستقبل أفضل.|actually=في الحقيقة، فعلًا
He had become immune to many of the fears that once controlled him.|صار محصّنًا ضد كثير من المخاوف التي كانت تسيطر عليه يومًا.|immune to=محصّن ضد، منيع أمام
Most importantly, he had learned to make his own decisions before it was too late.|والأهم من ذلك أنه تعلّم أن يتخذ قراراته بنفسه قبل فوات الأوان.|most importantly=والأهم من ذلك`},
{t:"A Life Beyond Imagination",x:`It was a cold winter morning when Dr. Adam received an urgent call from the central hospital.|كان صباح شتاء بارد حين تلقى الدكتور آدم اتصالًا عاجلًا من المستشفى المركزي.|urgent=عاجل، ملحّ؛ central=مركزي؛ hospital=مستشفى
A baby had been brought in after an earth-shaking accident that had left his parents seriously injured.|أُحضر طفل رضيع بعد حادث مدوٍّ هزّ الأرض ترك والديه مصابين إصابة خطيرة.|earth-shaking=مدوٍّ، هزّ الأرض، فادح؛ accident=حادث؛ injured=مصاب
The infant was alive, but his condition was extremely dangerous.|كان الرضيع حيًّا لكن حالته كانت بالغة الخطورة.|infant=رضيع، طفل صغير؛ condition=حالة

When Adam arrived, he noticed a strange scar on the baby’s face.|عندما وصل آدم، لاحظ ندبة غريبة على وجه الرضيع.|scar=ندبة، أثر جرح
The medical team explained that the child had fallen from a considerable height during the accident.|شرح الفريق الطبي أن الطفل سقط من ارتفاع كبير أثناء الحادث.|medical=طبي؛ team=فريق؛ considerable=كبير، ملحوظ؛ height=ارتفاع
Fortunately, his brain had not suffered severe damage.|لحسن الحظ، لم يتعرض دماغه لضرر شديد.|fortunately=لحسن الحظ؛ brain=دماغ؛ damage=ضرر، تلف

However, the accident had caused serious injuries to his lungs and several other organs.|ومع ذلك تسبب الحادث بإصابات خطيرة في رئتيه وعدة أعضاء أخرى.|injuries=إصابات؛ lungs=رئتان؛ organs=أعضاء
The doctors were certain that the baby needed an unprecedented medical procedure if he was going to survive.|كان الأطباء متأكدين من أن الرضيع يحتاج إلى إجراء طبي غير مسبوق إن أراد النجاة.|certain=متأكد؛ unprecedented=غير مسبوق؛ procedure=إجراء، عملية

Adam began to expound his medical theory to the team.|بدأ آدم يشرح نظريته الطبية للفريق بالتفصيل.|expound=يشرح بالتفصيل، يفسّر؛ theory=نظرية
He explained that the human body possessed an intrinsic ability to regenerate and renew damaged tissues, although this ability was limited.|شرح أن جسم الإنسان يمتلك قدرة جوهرية على تجديد الأنسجة التالفة وتعويضها، مع أن هذه القدرة محدودة.|possessed=يمتلك؛ intrinsic=جوهري، متأصل؛ regenerate=يجدد، يعيد النمو؛ renew=يجدد؛ tissues=أنسجة
“Think of the body as a living machine,” he said.|“فكّروا في الجسم كآلة حية،” قال.|machine=آلة
“Just as an apparatus can sometimes be repaired, certain organs can recover when they receive the right treatment.”|“كما يمكن أحيانًا إصلاح جهاز، يمكن لبعض الأعضاء أن تتعافى حين تتلقى العلاج المناسب.”|apparatus=جهاز، أداة؛ repaired=يُصلَح؛ recover=يتعافى؛ treatment=علاج

He used this analogy to explain his opinion and understanding of the case.|استخدم هذا التشبيه ليشرح رأيه وفهمه للحالة.|analogy=تشبيه، قياس تمثيلي؛ opinion=رأي؛ case=حالة
Then he set forth a brand-new treatment plan.|ثم عرض خطة علاج جديدة كليًّا.|set forth=يعرض، يطرح؛ brand-new=جديد كليًّا
Some doctors disagreed.|اعترض بعض الأطباء.|disagreed=يختلف، يعترض
Each aired his or her own views, and the discussion became increasingly serious.|أعلن كل منهم وجهة نظره، وأصبح النقاش أكثر جدية باستمرار.|aired=يعلن، يعبّر عن (آراءه)؛ views=وجهات نظر؛ increasingly=على نحو متزايد
One specialist conjectured that the baby might never regain consciousness if the operation failed.|خمّن أحد المتخصصين أن الرضيع قد لا يستعيد وعيه أبدًا إن فشلت العملية.|specialist=متخصص، أخصائي؛ conjectured=خمّن، افترض؛ regain=يستعيد؛ consciousness=وعي؛ operation=عملية جراحية

Adam listened carefully.|استمع آدم بعناية.|
He knew that medical decisions should not be based on guesses alone.|كان يعرف أن القرارات الطبية لا ينبغي أن تقوم على التخمين وحده.|based on=يقوم على؛ guesses=تخمينات
He had to think deeply, ponder every possibility, and infer the most likely outcome from the available evidence.|كان عليه أن يفكر بعمق ويتأمل كل احتمال ويستنتج النتيجة الأرجح من الأدلة المتاحة.|ponder=يتأمل، يمعن التفكير؛ infer=يستنتج؛ outcome=نتيجة؛ available=متاح
“For example,” he explained, “we must consider how the lungs function and whether the damaged tissues can be transported or grafted safely.”|“على سبيل المثال،” شرح، “علينا أن ندرس كيف تعمل الرئتان وهل يمكن نقل الأنسجة التالفة أو ترقيعها بأمان.”|for example=على سبيل المثال؛ function=يعمل، يؤدي وظيفته؛ transported=ينقل؛ grafted=يُطعَّم، يُزرع (نسيج/عضو)

The operation was extremely complicated.|كانت العملية بالغة التعقيد.|complicated=معقّد
It involved an organ graft and a special apparatus designed to support the baby’s breathing.|تضمنت زراعة عضو وجهازًا خاصًّا صُمّم لدعم تنفّس الرضيع.|designed=مصمَّم؛ breathing=تنفّس
Meanwhile, the child’s parents were waiting outside the operating room.|في الأثناء، كان والدا الطفل ينتظران خارج غرفة العمليات.|operating room=غرفة العمليات
His mother appeared melancholy and heavy-hearted.|بدت أمه كئيبة وثقيلة القلب.|melancholy=كئيب، حزين؛ heavy-hearted=مثقل القلب، حزين
She kept imagining a future in which her little boy would never return to her arms.|ظلّت تتخيل مستقبلًا لن يعود فيه ابنها الصغير إلى أحضانها.|imagining=يتخيل؛ arms=أحضان، ذراعان
Adam approached her and tried to reassure her.|اقترب منها آدم وحاول طمأنتها.|reassure=يطمئن، يهدّئ
“Your son is fighting for his life,” he said. “We will do everything possible.”|“ابنك يقاتل من أجل حياته،” قال. “سنفعل كل ما هو ممكن.”|fighting for his life=يقاتل من أجل حياته

After several hours, the operation was completed.|بعد عدة ساعات، اكتملت العملية.|completed=اكتملت
The baby remained unconscious for a while, and the doctors feared that he might be in a coma.|بقي الرضيع فاقدًا للوعي بعض الوقت، وخشي الأطباء أن يكون في غيبوبة.|unconscious=فاقد الوعي؛ for a while=لبعض الوقت؛ coma=غيبوبة
Then, unexpectedly, his fingers moved.|ثم، وعلى غير توقع، تحركت أصابعه.|fingers=أصابع
A few moments later, he began to regain consciousness and slowly opened his eyes.|وبعد لحظات قليلة بدأ يستعيد وعيه وفتح عينيه ببطء.|a few moments later=بعد لحظات قليلة
His mother rushed toward him, overwhelmed with joy.|اندفعت أمه نحوه وقد غمرتها الفرحة.|rushed=يندفع، يهرع؛ overwhelmed=غامر، مغمور
She looked at his tiny face and familiar features, noticing that even the smallest expression reminded her of the child she loved.|نظرت إلى وجهه الصغير جدًّا وملامحه المألوفة، وأدركت أن أصغر تعبير فيه يذكّرها بالطفل الذي أحبّته.|tiny=صغير جدًّا؛ features=ملامح؛ reminded=يذكّر

The medical achievement attracted tremendous attention.|جذب هذا الإنجاز الطبي اهتمامًا هائلًا.|tremendous=هائل، ضخم
News of the unprecedented operation spread to distant countries, and specialists from around the world wanted to understand how the procedure had been performed.|انتشر خبر العملية غير المسبوقة في بلدان بعيدة، وأراد متخصصون من أنحاء العالم فهم كيف أُجريت.|spread=ينتشر؛ distant=بعيد؛ performed=يُجري، يؤدي
Some journalists began to imagine its possible effects on the future of medicine.|بدأ بعض الصحفيين يتخيلون آثارها المحتملة في مستقبل الطب.|journalists=صحفيون؛ effects=آثار، تأثيرات؛ medicine=الطب
Others wrote speeches and public opinions about the ethical questions involved.|وكتب آخرون خطبًا ومقالات رأي عامة عن الأسئلة الأخلاقية المرتبطة.|speeches=خطابات؛ public=عام، جماهيري؛ ethical=أخلاقي
A famous professor argued that medical progress should never be separated from moral responsibility.|رأى أستاذ مشهور أن التقدم الطبي يجب ألا ينفصل أبدًا عن المسؤولية الأخلاقية.|professor=أستاذ جامعي؛ argued=يجادل، يرى؛ progress=تقدم؛ moral=أخلاقي، معنوي
His theory was that science should protect life, not simply change it.|كانت نظريته أن العلم ينبغي أن يحمي الحياة لا أن يغيّرها فحسب.|science=علم
Adam agreed. He believed that life was precious and that every new discovery should serve humanity.|وافق آدم. كان يؤمن بأن الحياة ثمينة وأن كل اكتشاف جديد ينبغي أن يخدم الإنسانية.|precious=ثمين، عزيز؛ discovery=اكتشاف؛ humanity=الإنسانية

Years later, the baby grew into a healthy young man.|بعد سنوات، كبر الرضيع وصار شابًا سليمًا.|healthy=سليم، بصحة جيدة
He was carefree and free from anxieties, unaware of how close he had once come to losing his life.|كان خالي البال بلا مخاوف، غير مدرك كم كان قريبًا يومًا من فقدان حياته.|carefree=خالي البال، بلا هموم؛ anxieties=مخاوف، قلق؛ unaware=غير مدرك
One day, he visited Adam and thanked him.|في يوم ما زار آدم وشكره.|thanked=يشكر
“You gave me a second chance at life,” he said.|“لقد منحتني فرصة ثانية للحياة،” قال.|second chance=فرصة ثانية
Adam smiled. He knew that the operation had been a tremendous achievement, but the greatest miracle was not the medical procedure itself.|ابتسم آدم. كان يعرف أن العملية كانت إنجازًا عظيمًا، لكن أعظم معجزة لم تكن الإجراء الطبي نفسه.|miracle=معجزة
It was the chance for a new life to begin.|بل كانت فرصة لبدء حياة جديدة.|chance=فرصة`},
{t:"The Detective’s Last Chance",x:`Detective James was a serious and intelligent man.|كان المحقق جيمس رجلًا جادًا وذكيًّا.|detective=محقق، مخبر؛ intelligent=ذكي
He was famous for his fine investigative skills and his solemn attitude toward every legal case.|اشتهر بمهاراته التحقيقية الراقية وموقفه الجاد الرصين من كل قضية قانونية.|famous=مشهور؛ fine=راقٍ، دقيق، ممتاز؛ investigative=تحقيقي؛ solemn=وقور، رصين، جاد؛ attitude=موقف، اتجاه؛ legal case=قضية قانونية
Solving mysteries was his strong suit, and he always believed that even the most terrible crimes could be solved.|كان حل الألغاز نقطة قوته، وكان يؤمن دائمًا بأن حتى أفظع الجرائم يمكن حلها.|strong suit=نقطة قوة، مجال تفوّق؛ mysteries=ألغاز؛ crimes=جرائم

One evening, the police received a call about a wealthy businessman who had been kidnapped.|في مساء ما، تلقت الشرطة بلاغًا عن رجل أعمال ثري تعرّض للخطف.|police=شرطة؛ wealthy=ثري، غني؛ businessman=رجل أعمال؛ kidnapped=مخطوف
His family was terrified.|كانت عائلته مذعورة.|terrified=مذعور، مرتعب
His daughter tried to suppress her tears, while his son began to shout at the officers, demanding that they find his father immediately.|حاولت ابنته كبت دموعها، بينما بدأ ابنه يصرخ في الضباط مطالبًا إياهم بإيجاد أبيه فورًا.|suppress=يكبت، يقمع؛ officers=ضباط؛ demand=يطالب بـ

James told everyone to remain calm.|طلب جيمس من الجميع التزام الهدوء.|
“You might as well tell me everything you know,” he said. “Every little thing could be important.”|“من الأفضل أن تخبروني بكل ما تعرفونه،” قال. “أي تفصيل صغير قد يكون مهمًا.”|might as well=من الأفضل أن، لا ضير في أن

The family explained that their father had been suffering hardships recently.|شرحت العائلة أن أباهم كان يعاني متاعب مؤخرًا.|
His business was weak, and his competitors had treated him coldly.|كان عمله ضعيفًا، وقد عامله منافسوه ببرود.|weak=ضعيف؛ competitors=منافسون؛ coldly=ببرود
He had become emotionally numb and apathetic.|أصبح متبلّد المشاعر وغير مبالٍ.|emotionally=عاطفيًّا؛ numb=متبلّد، مخدّر؛ apathetic=لا مبالٍ، غير مكترث
He used to be cheerful and in high spirits, but lately he seemed empty inside.|كان فيما مضى مرحًا ومعنوياته عالية، لكنه بدا مؤخرًا فارغًا من الداخل.|cheerful=مرح، مبتهج؛ lately=مؤخرًا، في الآونة الأخيرة؛ empty=فارغ

James began to put his hand to the investigation.|بدأ جيمس يضع يده في التحقيق ويباشره.|put one’s hand to=يشرع في، يباشر؛ investigation=تحقيق
He asked his assistant to call the police department and arrange for additional officers.|طلب من مساعده الاتصال بقسم الشرطة وترتيب إرسال ضباط إضافيين.|arrange for=يرتّب لـ؛ additional=إضافي
He also needed to find a safe place for the businessman’s young son, so he wouldn’t be disturbed by the investigation.|كما احتاج إلى إيجاد مكان آمن لابن رجل الأعمال الصغير كي لا يتأثر بالتحقيق.|disturbed=مزعَج، مضطرب
“Don’t interfere with my work,” James warned the reporters.|“لا تتدخلوا في عملي،” حذّر جيمس الصحفيين.|interfere with=يتدخل في، يعرقل؛ reporters=مراسلون صحفيون
“And don’t distract the officers.”|“ولا تشتتوا انتباه الضباط.”|distract=يشتّت الانتباه

At the crime scene, James noticed something unusual: a lottery ticket lying beside a bowl of porridge.|في مسرح الجريمة، لاحظ جيمس شيئًا غير معتاد: تذكرة يانصيب ملقاة بجانب وعاء من العصيدة.|crime scene=مسرح الجريمة؛ lottery ticket=تذكرة يانصيب؛ porridge=عصيدة، شوفان مطبوخ؛ bowl=وعاء، طاسة
The porridge was still warm, and bubbles were rising from a small pot in the kitchen.|كانت العصيدة لا تزال دافئة، وكانت فقاعات تتصاعد من قدر صغير في المطبخ.|bubbles=فقاعات؛ rising=يتصاعد؛ pot=قدر
“Someone was here recently,” he whispered.|“كان أحدهم هنا مؤخرًا،” همس.|

He examined the room carefully. The furniture was stiff and hardened with age, but the floor had fresh marks.|فحص الغرفة بعناية. كان الأثاث متيبسًا وقاسيًا من القِدم، لكن على الأرض آثارًا جديدة.|stiff=متيبّس، جامد؛ hardened=متصلّب؛ fresh=طازج، جديد؛ marks=آثار، علامات
There were signs of an attack, and a chair had been thrown across the room.|كانت هناك علامات اعتداء، وقد رُمي كرسي عبر الغرفة.|signs=علامات، دلائل؛ attack=اعتداء، هجوم؛ thrown=رُمي

James asked the servants about the incident.|سأل جيمس الخدم عن الحادثة.|servants=خدم؛ incident=حادثة، واقعة
One of them blinked nervously and winked at another servant.|رمش أحدهم بتوتر وغمز لخادم آخر.|blinked=يرمش، يطرف
James immediately noticed their strange behavior.|لاحظ جيمس سلوكهم الغريب على الفور.|
“Tell me the truth,” he said. “I know you’re hiding something.”|“أخبروني بالحقيقة،” قال. “أعرف أنكم تخفون شيئًا.”|hiding=يخفي

The older servant finally confessed that the businessman had been attacked by two men.|اعترف الخادم الأكبر سنًّا أخيرًا بأن رجل الأعمال تعرّض لهجوم من رجلين.|confessed=يعترف
They had threatened him and treated him like a slave.|لقد هدّداه وعاملاه كالعبد.|slave=عبد
They had forced him to work without rest, and he had suffered terribly.|أجبراه على العمل دون راحة، وعانى كثيرًا.|rest=راحة
The servant explained that the criminals had tried to prevent him from calling the police.|شرح الخادم أن المجرمين حاولا منعه من الاتصال بالشرطة.|prevent=يمنع
They had even threatened to assault him if he spoke.|بل هدّداه حتى بالاعتداء عليه إن تكلّم.|assault=يعتدي على
James listened carefully. He knew that the criminals were extremely dangerous.|استمع جيمس بعناية. كان يعرف أن المجرمين بالغا الخطورة.|
Their cruelty was terrible, and their actions had shocked the entire neighborhood.|كانت قسوتهما فظيعة، وقد صدمت أفعالهما الحي بأكمله.|shocked=صدم؛ neighborhood=حي، جوار

He decided to work and rest in short periods, rather than exhaust himself.|قرر أن يعمل ويستريح على فترات قصيرة بدلًا من أن ينهك نفسه.|periods=فترات؛ exhaust=ينهك، يستنزف
He ate some porridge to make up for the meal he had missed, then returned to the investigation.|أكل بعض العصيدة ليعوّض الوجبة التي فاتته، ثم عاد إلى التحقيق.|make up for=يعوّض عن؛ meal=وجبة؛ missed=فاتته، تغيّب عن
His assistant suggested that they follow the money.|اقترح مساعده أن يتتبعوا المال.|suggested=يقترح؛ follow the money=يتتبع أثر المال
The criminals had probably used the businessman’s wealth to arrange their escape.|ربما استخدم المجرمان ثروة رجل الأعمال لترتيب هروبهما.|probably=على الأرجح
James agreed. “We can serve two purposes at once: find the missing man and discover who planned the kidnapping.”|وافق جيمس: “يمكننا أن نحقق غرضين معًا: إيجاد الرجل المفقود واكتشاف من خطّط للخطف.”|serve two purposes=يحقق غرضين؛ missing=مفقود؛ kidnapping=خطف، اختطاف

Meanwhile, the criminals were hiding in an abandoned factory.|في الأثناء، كان المجرمان يختبئان في مصنع مهجور.|
One of them was a frail man with weak arms and legs, while the other had strong four limbs and looked like a professional fighter.|كان أحدهما رجلًا واهنًا بذراعين وساقين ضعيفتين، بينما كان للآخر أطراف أربعة قوية وبدا كمقاتل محترف.|frail=واهن، هزيل؛ limbs=أطراف (الجسم)؛ fighter=مقاتل
They were listening to rock and roll music, trying to relax.|كانا يستمعان إلى موسيقى الروك آند رول محاولين الاسترخاء.|rock and roll=روك آند رول؛ relax=يسترخي
The music seemed to permeate the entire building.|بدت الموسيقى تتخلل المبنى بأكمله.|permeate=يتخلل، ينفذ في

Suddenly, a noise came from outside. One criminal shouted, and the other froze.|فجأة، جاءت ضجة من الخارج. صاح أحد المجرمين، وتجمّد الآخر.|froze=تجمّد، جمد في مكانه
James had discovered their location.|كان جيمس قد اكتشف مكانهما.|location=موقع، مكان
“Don’t move!” he roared as the officers entered the factory.|“لا تتحركوا!” زأر بينما دخل الضباط المصنع.|roared=يزأر، يصيح بصوت عالٍ
The criminals attempted to attack the police, but they were quickly surrounded.|حاول المجرمان مهاجمة الشرطة، لكنهما حوصرا بسرعة.|surrounded=محاصَر
James managed to break through their defenses and arrest them.|تمكّن جيمس من اختراق دفاعاتهما والقبض عليهما.|break through=يخترق، يشقّ طريقه؛ defenses=دفاعات؛ arrest=يعتقل، يقبض على
The businessman was found in a locked room. He was exhausted, but alive.|وُجد رجل الأعمال في غرفة مقفلة. كان منهكًا لكنه حيّ.|locked=مقفل

The discovery astonished everyone.|أذهل الاكتشاف الجميع.|astonished=يذهل، يدهش
The lottery ticket had been the key to the case: it contained a fingerprint that connected one of the criminals to the kidnapping.|كانت تذكرة اليانصيب مفتاح القضية: فقد احتوت على بصمة تربط أحد المجرمين بالخطف.|key=مفتاح؛ fingerprint=بصمة إصبع
After the rescue, the businessman thanked James.|بعد الإنقاذ، شكر رجل الأعمال جيمس.|rescue=إنقاذ
He finally felt at peace, free from anxiety.|شعر أخيرًا بالسلام، متحرّرًا من القلق.|at peace=مرتاح البال، في سلام
The empty feeling that had haunted his family began to disappear.|بدأ الشعور بالفراغ الذي طارد عائلته يتلاشى.|haunted=يطارد، يلازم
James smiled. He had solved a horrible legal case, rescued an innocent man, and made a major breakthrough in his career.|ابتسم جيمس. لقد حلّ قضية قانونية مروعة وأنقذ رجلًا بريئًا وحقق إنجازًا كبيرًا في مسيرته.|horrible=مروّع، فظيع؛ innocent=بريء؛ breakthrough=إنجاز كبير، اختراق
For the first time in months, he felt cheerful and carefree.|وللمرة الأولى منذ شهور، شعر بالمرح وخلوّ البال.|`},
{t:"The Valley Where Nature and Culture Meet",x:`Far away from the crowded human world, there was a small village in the Andes Mountains of Peru.|بعيدًا عن عالم البشر المزدحم، كانت هناك قرية صغيرة في جبال الأنديز في بيرو.|crowded=مزدحم؛ Andes=الأنديز
The village stood in a magnificent region surrounded by vast hills, a beautiful lake, and countless small streams and brooks.|وقفت القرية في منطقة رائعة تحيط بها تلال شاسعة وبحيرة جميلة وجداول صغيرة لا تُحصى.|region=منطقة؛ vast=شاسع؛ countless=لا يُحصى؛ streams=جداول، مجاري مائية؛ brooks=جداول صغيرة

From the highest hill, visitors could enjoy a breathtaking field of vision.|من أعلى تل، كان بإمكان الزوار الاستمتاع بمجال رؤية خلّاب.|breathtaking=خلّاب، يخطف الأنفاس؛ field of vision=مجال الرؤية
The view was so glorious and splendid that even experienced travelers found it difficult to describe.|كان المنظر مجيدًا وبديعًا لدرجة أن حتى المسافرين ذوي الخبرة وجدوا صعوبة في وصفه.|glorious=مجيد، رائع؛ travelers=مسافرون؛ describe=يصف
The mountains, water, and green fields blended together in harmonious proportions, creating a truly superb landscape.|امتزجت الجبال والماء والحقول الخضراء معًا بنِسَب متناغمة، لتخلق منظرًا طبيعيًا رائعًا حقًّا.|blended=امتزج؛ proportions=نِسَب، تناسب؛ superb=رائع، ممتاز؛ landscape=منظر طبيعي

The region contained an extraordinary variety of birds and beasts.|احتوت المنطقة على تنوّع استثنائي من الطيور والوحوش.|variety=تنوّع؛ beasts=وحوش، حيوانات
Some lived near the lake, while others moved freely across the hills.|عاش بعضها قرب البحيرة، بينما تنقّل آخر بحرية عبر التلال.|
The natural environment was so rich that it could hold in store countless surprises for anyone willing to explore it.|كانت البيئة الطبيعية غنية لدرجة أنها تحتفظ في جعبتها بمفاجآت لا تُحصى لكل من يرغب في استكشافها.|environment=بيئة؛ rich=غني؛ hold in store=يخبّئ، يحتفظ في جعبته؛ surprises=مفاجآت؛ explore=يستكشف

The villagers had developed a traditional system of agriculture.|طوّر القرويون نظامًا تقليديًّا للزراعة.|villagers=قرويون؛ agriculture=زراعة
They planted potatoes, maize, and quinoa, and cultivated different crops according to the season.|زرعوا البطاطس والذرة والكينوا، وزرعوا محاصيل مختلفة بحسب الموسم.|planted=زرع؛ maize=ذرة؛ quinoa=الكينوا؛ cultivated=يزرع، يفلح؛ crops=محاصيل؛ season=موسم
Some families also bred llamas and alpacas, which were essential to their way of life.|وربّت بعض العائلات أيضًا اللاما والألبكة، وهي أساسية لنمط حياتهم.|bred=ربّى، استولد؛ llamas=حيوانات اللاما؛ alpacas=الألبكة؛ essential=أساسي، ضروري؛ way of life=نمط الحياة

Their agricultural methods were meticulous and elaborate.|كانت أساليبهم الزراعية دقيقة ومتقنة.|agricultural=زراعي؛ meticulous=دقيق للغاية، مدقّق؛ elaborate=متقن، مفصّل
Every field had a distinct shape and pattern, designed to make the best use of the land and water.|كان لكل حقل شكل ونمط مميزان، صُمّما للاستفادة القصوى من الأرض والماء.|distinct=مميز، واضح؛ shape=شكل؛ pattern=نمط؛ make the best use of=يستفيد أقصى استفادة من
The farmers carefully distinguished between different types of soil and knew exactly which crops could grow in each area.|ميّز المزارعون بعناية بين أنواع التربة المختلفة وعرفوا تمامًا أي المحاصيل تنمو في كل منطقة.|farmers=مزارعون؛ distinguished=يميّز؛ soil=تربة

One day, a young architect named Elena arrived in the village.|في يوم ما، وصلت إلى القرية مهندسة معمارية شابة تُدعى إيلينا.|architect=مهندس معماري
She wanted to conceive and design a new irrigation system that would convey water from the mountain streams to the distant fields.|أرادت أن تتصور وتصمم نظام ري جديدًا ينقل الماء من جداول الجبال إلى الحقول البعيدة.|conceive=يتصور، يبتكر فكرة؛ irrigation=ري؛ convey=ينقل، يوصل
Her plan was clear-cut and practical.|كانت خطتها واضحة ومحدّدة وعملية.|clear-cut=واضح ومحدد، لا لبس فيه
The system would contain several small channels, each constructed to distribute water evenly.|سيحتوي النظام على عدة قنوات صغيرة، شُيّدت كل منها لتوزيع الماء بالتساوي.|channels=قنوات؛ constructed=مشيَّد؛ distribute=يوزّع؛ evenly=بالتساوي
She believed that traditional knowledge and modern engineering could blend perfectly.|كانت تؤمن بأن المعرفة التقليدية والهندسة الحديثة يمكن أن تمتزجا بإتقان.|modern=حديث؛ engineering=هندسة؛ perfectly=بإتقان

However, some villagers rejected her proposal.|غير أن بعض القرويين رفضوا اقتراحها.|rejected=رفض؛ proposal=اقتراح، مقترح
They feared that the new system might repel wildlife, damage the landscape, or exclude local farmers from important decisions.|خافوا أن يُبعد النظام الجديد الحياة البرية أو يُفسد المنظر الطبيعي أو يُقصي المزارعين المحليين عن القرارات المهمة.|repel=يُبعد، يطرد، ينفّر؛ wildlife=الحياة البرية؛ exclude=يُقصي، يستبعد؛ local=محلي
Elena listened carefully. She did not want to impose her ideas on the community.|استمعت إيلينا بعناية. لم ترد أن تفرض أفكارها على المجتمع.|impose=يفرض
Instead, she asked the villagers to explain their concerns and suggest improvements.|بل طلبت من القرويين أن يشرحوا مخاوفهم ويقترحوا تحسينات.|concerns=مخاوف، همومهم؛ improvements=تحسينات

During the discussions, an elderly farmer named Mateo shared his wisdom.|أثناء النقاشات، شارك مزارع مسنّ يُدعى ماتيو حكمته.|wisdom=حكمة
“Nature is not something we own,” he said. “It is something we benefit from, protect, and pass on to future generations.”|“الطبيعة ليست شيئًا نملكه،” قال. “إنها شيء نستفيد منه ونحميه ونورّثه للأجيال القادمة.”|nature=الطبيعة؛ own=يملك؛ benefit from=يستفيد من؛ pass on=يورّث، ينقل إلى؛ generations=أجيال
He explained that the village’s diet was closely connected to its environment.|شرح أن غذاء القرية مرتبط ارتباطًا وثيقًا ببيئتها.|diet=نظام غذائي، غذاء؛ closely=ارتباطًا وثيقًا
Their food and drink came mainly from local farms, and each traditional meal had its own authentic flavor.|جاء طعامهم وشرابهم أساسًا من المزارع المحلية، وكانت لكل وجبة تقليدية نكهتها الأصيلة.|mainly=أساسًا، في الغالب؛ authentic=أصيل، حقيقي؛ flavor=نكهة

The villagers prepared a vegetarian meal using potatoes, maize, beans, and fresh vegetables.|أعدّ القرويون وجبة نباتية باستخدام البطاطس والذرة والفاصولياء والخضروات الطازجة.|prepared=يُعدّ، يحضّر؛ vegetarian=نباتي؛ beans=فاصولياء؛ vegetables=خضروات
They cooked everything slowly and used natural seasoning and condiments.|طهوا كل شيء ببطء واستخدموا توابل وتتبيلات طبيعية.|seasoning=تتبيل، توابل؛ condiments=مُنكِّهات، صلصات؛ natural=طبيعي
The meal was simple, yet its taste was superb.|كانت الوجبة بسيطة، ومع ذلك كان طعمها رائعًا.|simple=بسيط؛ taste=طعم، ذوق
“Food is more than something we eat,” Mateo explained. “It carries our history, our identity, and our inspiration.”|“الطعام أكثر من شيء نأكله،” شرح ماتيو. “إنه يحمل تاريخنا وهويتنا وإلهامنا.”|identity=هوية؛ inspiration=إلهام

Elena realized that the project needed to respect the village’s inner values.|أدركت إيلينا أن المشروع يجب أن يحترم القيم الداخلية للقرية.|inner=داخلي، باطني؛ values=قيم
She redesigned the system to preserve the natural streams and protect the surrounding wildlife.|أعادت تصميم النظام للحفاظ على الجداول الطبيعية وحماية الحياة البرية المحيطة.|redesigned=يعيد التصميم؛ preserve=يحافظ على، يصون
The new plan was so carefully designed that it could benefit both agriculture and nature.|كانت الخطة الجديدة مصممة بعناية لدرجة أنها تنفع الزراعة والطبيعة معًا.|
Even if the villagers disagreed at first, they gradually began to approve of the idea.|حتى لو اختلف القرويون في البداية، فقد بدأوا تدريجيًّا يوافقون على الفكرة.|approve of=يستحسن، يوافق على

The project brought forth new ideas and encouraged the community to innovate.|أثمر المشروع أفكارًا جديدة وشجّع المجتمع على الابتكار.|brought forth=يُنتج، يثمر؛ innovate=يبتكر، يجدّد
Farmers introduced new ways to process their crops, preserve food, and cultivate the land without exhausting its resources.|أدخل المزارعون طرقًا جديدة لمعالجة محاصيلهم وحفظ الطعام وزراعة الأرض دون استنزاف مواردها.|process=يعالج، يصنّع؛ resources=موارد
In the same way, the younger generation learned to appreciate the knowledge of their elders.|وبالطريقة نفسها، تعلّم الجيل الأصغر تقدير معرفة كبارهم.|in the same way=بالطريقة نفسها؛ younger generation=الجيل الأصغر؛ elders=كبار السن
Every evening, the villagers gathered near the lake to have their meal.|كل مساء، كان القرويون يجتمعون قرب البحيرة لتناول وجبتهم.|gathered=اجتمع؛ have a meal=يتناول وجبة
They shared food, stories, and laughter while the sun disappeared behind the hills.|تشاركوا الطعام والحكايات والضحكات بينما اختفت الشمس خلف التلال.|shared=تشارك؛ laughter=ضحك
The village had become a glorious example of how human life could exist in harmony with nature.|أصبحت القرية مثالًا رائعًا على كيف يمكن للحياة البشرية أن تتعايش في انسجام مع الطبيعة.|example=مثال؛ exist=يوجد، يتعايش؛ in harmony with=في انسجام مع
And Elena understood something important: progress did not mean rejecting the past.|وفهمت إيلينا شيئًا مهمًّا: التقدم لا يعني رفض الماضي.|
It meant creating a better future while preserving what was authentic and valuable.|بل يعني صنع مستقبل أفضل مع الحفاظ على ما هو أصيل وقيّم.|`},
{t:"The Secret Life of the Wild",x:`In the heart of South Africa, there was a vast wildlife reserve surrounded by deep valleys, green forests, and beautiful mountains.|في قلب جنوب أفريقيا، كانت هناك محمية حياة برية شاسعة تحيط بها وديان عميقة وغابات خضراء وجبال جميلة.|in the heart of=في قلب؛ reserve=محمية؛ valleys=وديان؛ forests=غابات
The reserve was home to lions, leopards, elephants, and countless other animals.|كانت المحمية موطنًا للأسود والفهود والفيلة وحيوانات أخرى لا تُحصى.|home to=موطن لـ؛ leopards=فهود، نمور مرقطة؛ elephants=فيلة

A young wildlife researcher named Daniel worked there with an experienced and knowledgeable conservationist called Mr. Thomas.|عمل هناك باحث شاب في الحياة البرية يُدعى دانيال مع مختص خبير واسع المعرفة في حماية البيئة يُدعى السيد توماس.|researcher=باحث؛ knowledgeable=واسع المعرفة، مطّلع؛ conservationist=مختص/ناشط في حماية البيئة
Daniel had received an excellent education in biology, but Thomas believed that education alone was not enough.|تلقى دانيال تعليمًا ممتازًا في علم الأحياء، لكن توماس كان يؤمن بأن التعليم وحده لا يكفي.|excellent=ممتاز؛ education=تعليم؛ biology=علم الأحياء
True culture and breeding of character, he often said, were reflected in how a person treated living creatures.|وكان يقول كثيرًا إن الثقافة الحقيقية وتهذيب الشخصية يتجليان في كيفية تعامل المرء مع الكائنات الحية.|breeding=تربية، تهذيب؛ character=شخصية، طباع؛ reflected=يتجلى، ينعكس؛ creatures=كائنات

Thomas was a respectful gentleman, a virtuous man who treated everyone with great respect.|كان توماس رجلًا نبيلًا محترمًا، فاضلًا يعامل الجميع بكل احترام.|respectful=محترم، مهذّب؛ virtuous=فاضل، ذو فضيلة
He was also a model of patience and kindness.|وكان أيضًا نموذجًا في الصبر واللطف.|model=نموذج، قدوة
Daniel, however, was sometimes lazy and impatient.|أما دانيال فكان أحيانًا كسولًا ونافد الصبر.|lazy=كسول
He wanted immediate results and was eager to discover something extraordinary.|أراد نتائج فورية وكان متلهفًا لاكتشاف شيء استثنائي.|results=نتائج
Thomas reminded him that happiness consists in contentment, and that meaningful achievements require time and effort.|ذكّره توماس بأن السعادة تكمن في القناعة، وأن الإنجازات ذات المعنى تتطلب وقتًا وجهدًا.|consist in=يكمن في، يتمثل في؛ contentment=قناعة، رضا

One morning, Daniel decided to pay a visit to a remote section of the reserve.|في صباح ما، قرر دانيال زيارة قسم نائٍ من المحمية.|pay a visit=يقوم بزيارة؛ remote=نائٍ، بعيد؛ section=قسم، جزء
He had heard reports of a young leopard roaming about the area.|كان قد سمع تقارير عن فهد صغير يتجول في المنطقة.|roam=يتجول، يجوب
The animal had apparently lost its mother and was leading a vagrant life, moving from one corner of the forest to another.|يبدو أن الحيوان فقد أمه وكان يعيش حياة تشرد، ينتقل من ركن في الغابة إلى آخر.|apparently=على ما يبدو؛ vagrant=متشرد، هائم؛ corner=ركن، زاوية

The researchers had installed the most advanced camera system available.|كان الباحثون قد ركّبوا أحدث نظام كاميرات متاح.|install=يركّب، يثبّت؛ advanced=متقدم، حديث؛ camera=كاميرا
Each camera had a sensitive lens capable of capturing even the smallest movement.|كان لكل كاميرا عدسة حساسة قادرة على التقاط أدق حركة.|sensitive=حساس؛ lens=عدسة؛ capturing=يلتقط؛ movement=حركة
The equipment could monitor animals day and night, store thousands of images, and transmit information to a control room.|استطاعت المعدات مراقبة الحيوانات ليل نهار وتخزين آلاف الصور ونقل المعلومات إلى غرفة تحكم.|equipment=معدات؛ monitor=يراقب؛ store=يخزّن؛ transmit=ينقل، يرسل؛ control room=غرفة التحكم
Some cameras could even be remotely controlled.|بل كان بالإمكان التحكم في بعض الكاميرات عن بُعد.|remotely=عن بُعد
The researchers could operate them immediately, adjust their position, and follow the tracks of animals without disturbing their natural behavior.|استطاع الباحثون تشغيلها فورًا وضبط وضعها وتتبع آثار الحيوانات دون إزعاج سلوكها الطبيعي.|adjust=يضبط، يعدّل؛ tracks=آثار، مسارات؛ disturbing=يزعج

Daniel began to study the camera recordings intensively.|بدأ دانيال يدرس تسجيلات الكاميرات بتركيز مكثف.|recordings=تسجيلات؛ intensively=بشكل مكثف
He examined every scene and shot, looking for traces of the young leopard.|فحص كل مشهد ولقطة بحثًا عن آثار الفهد الصغير.|scene=مشهد؛ shot=لقطة؛ traces=آثار، بقايا
Suddenly, he noticed something unusual.|فجأة، لاحظ شيئًا غير معتاد.|

A small animal was lying prone beneath a tree, with its stomach touching the ground.|كان حيوان صغير مستلقيًا على بطنه تحت شجرة، وبطنه يلامس الأرض.|lying prone=مستلقٍ على بطنه؛ beneath=تحت، أسفل؛ stomach=بطن، معدة
Its keen sense of smell helped it detect food from a considerable distance.|ساعدته حاسة شم قوية على اكتشاف الطعام من مسافة بعيدة.|sense of smell=حاسة الشم؛ detect=يكتشف، يرصد؛ distance=مسافة
It was a young leopard, and its movements were quick, nimble, and agile.|كان فهدًا صغيرًا، وكانت حركاته سريعة ورشيقة وخفيفة.|quick=سريع؛ nimble=رشيق، خفيف الحركة؛ agile=رشيق، سريع الحركة

Daniel gazed at the screen.|حدّق دانيال في الشاشة.|gazed=حدّق، تأمل؛ screen=شاشة
The animal suddenly threw itself on a small bird, but failed to catch it.|ألقى الحيوان بنفسه فجأة على طائر صغير لكنه فشل في الإمساك به.|threw itself on=ينقضّ على، يلقي بنفسه على؛ catch=يمسك، يقبض على
It then stared deeply into the bushes, apparently searching for another opportunity.|ثم حدّق بعمق في الأدغال، باحثًا على ما يبدو عن فرصة أخرى.|bushes=أدغال، شجيرات؛ searching=يبحث
“Look at that movement!” Daniel exclaimed.|“انظر إلى تلك الحركة!” هتف دانيال.|exclaimed=هتف، صاح (من الدهشة)
Thomas smiled. “Never judge an animal by one action. You must understand its entire motion and behavior.”|ابتسم توماس: “لا تحكم أبدًا على حيوان من فعل واحد. يجب أن تفهم حركته وسلوكه كاملًا.”|judge=يحكم على؛ motion=حركة، سير

They continued watching. The leopard appeared hungry and somewhat weak.|واصلوا المشاهدة. بدا الفهد جائعًا وضعيفًا نوعًا ما.|hungry=جائع؛ somewhat=نوعًا ما
It had a small defect in one of its front paws, which affected its ability to hunt.|كان في إحدى قوائمه الأمامية عيب صغير أثّر في قدرته على الصيد.|defect=عيب، خلل؛ paws=كفوف، مخالب؛ hunt=يصطاد
The team decided to raise the animal temporarily at a special rehabilitation center.|قرر الفريق تربية الحيوان مؤقتًا في مركز إعادة تأهيل خاص.|raise=يربّي؛ rehabilitation=إعادة تأهيل
They would feed it carefully, clean its living space, and monitor its health until it became strong enough to return to the wild.|سيطعمونه بعناية وينظفون مساحة معيشته ويراقبون صحته حتى يصبح قويًّا بما يكفي للعودة إلى البرية.|feed=يطعم، يغذّي؛ clean=ينظّف؛ the wild=البرية

The center was busy and bustling.|كان المركز مشغولًا وصاخب النشاط.|bustling=صاخب بالنشاط، مزدحم بالحركة
Workers were cleaning cages, preparing food, and caring for several rescued animals.|كان العاملون ينظفون الأقفاص ويجهزون الطعام ويعتنون بعدة حيوانات تم إنقاذها.|cages=أقفاص؛ caring for=يعتني بـ، يرعى
A cheerful and jolly veterinarian named Maria welcomed Daniel.|رحّبت بدانيال طبيبة بيطرية مرحة بشوشة تُدعى ماريا.|jolly=مرح، بشوش؛ veterinarian=طبيب بيطري؛ welcomed=رحّب
She was loving and affectionate toward the animals.|كانت محبة وحنونة تجاه الحيوانات.|loving=محب؛ affectionate=حنون، عطوف
She had an intimate understanding of their needs and treated each one with patience.|كان لديها فهم عميق لاحتياجاتها وعاملت كلًّا منها بصبر.|needs=احتياجات

“Some animals are greedy and gluttonous,” she joked, “but this little leopard is an exception. It barely eats anything!”|“بعض الحيوانات جشعة وشرهة،” قالت مازحة، “لكن هذا الفهد الصغير استثناء. إنه بالكاد يأكل شيئًا!”|greedy=جشع، طمّاع؛ gluttonous=شره، نهم؛ joked=مزح؛ exception=استثناء
Daniel laughed. He poured fresh water into a bowl and prepared a suitable meal.|ضحك دانيال. سكب ماءً عذبًا في وعاء وحضّر وجبة مناسبة.|poured=صبّ، سكب
He made sure not to drench the animal accidentally while cleaning its enclosure.|حرص على ألّا يبلّل الحيوان بالماء عن غير قصد أثناء تنظيف حظيرته.|made sure=تأكّد، حرص؛ drench=يبلّل تمامًا؛ accidentally=عن غير قصد؛ enclosure=حظيرة، سياج
The leopard slowly began to trust the team.|بدأ الفهد ببطء يثق بالفريق.|
Whenever Maria entered the room, it looked at her with an almost charming expression.|كلما دخلت ماريا الغرفة، نظر إليها بتعبير ساحر تقريبًا.|whenever=كلما، متى ما؛ charming=ساحر، جذاب
Its eyes seemed to communicate a quiet affection.|بدت عيناه تعبّران عن مودة هادئة.|communicate=يعبّر، يتواصل؛ affection=مودة، حنان

Meanwhile, Thomas asked Daniel to rely on his own efforts rather than depend entirely on technology.|في الأثناء، طلب توماس من دانيال الاعتماد على جهوده الخاصة بدل الاعتماد كليًّا على التكنولوجيا.|entirely=كليًّا، بالكامل؛ technology=تكنولوجيا
Cameras could provide valuable information, but they could not replace careful observation.|يمكن للكاميرات توفير معلومات قيّمة، لكنها لا تستطيع أن تحل محل الملاحظة الدقيقة.|information=معلومات؛ replace=يحل محل، يستبدل؛ observation=ملاحظة، مراقبة
One afternoon, the team decided to follow the tracks of another leopard that had been spotted near the eastern boundary.|بعد ظهر يوم ما، قرر الفريق تتبع آثار فهد آخر شوهد قرب الحدود الشرقية.|spotted=شوهد، رُصد؛ eastern=شرقي؛ boundary=حدود، تخم
Daniel carefully examined every trace and trail in the soil.|فحص دانيال بعناية كل أثر ومسار في التربة.|trail=مسار، أثر طريق

He noticed a faint sound of something astir in a small nook behind a rock.|لاحظ صوتًا خافتًا لشيء يتحرك في ركن صغير خلف صخرة.|astir=متحرك، في حركة؛ nook=ركن صغير، زاوية؛ rock=صخرة
He stared into the corner and immediately saw movement.|حدّق في الركن ورأى الحركة فورًا.|stared=حدّق
It was the young leopard!|كان الفهد الصغير!|
The animal had escaped from its temporary enclosure and wandered into the surrounding forest.|كان الحيوان قد هرب من حظيرته المؤقتة وتاه في الغابة المحيطة.|wandered=تجوّل، هام، تاه
Daniel used the remote control to operate a nearby camera and monitor its position.|استخدم دانيال جهاز التحكم عن بُعد لتشغيل كاميرا قريبة ومراقبة موضعه.|remote control=جهاز تحكم عن بعد

Unfortunately, he made an error while adjusting the equipment.|لسوء الحظ، ارتكب خطأ أثناء ضبط المعدات.|unfortunately=لسوء الحظ؛ error=خطأ
The camera turned in the wrong direction, and the team temporarily lost sight of the animal.|استدارت الكاميرا في الاتجاه الخاطئ، وفقد الفريق الحيوان من مجال الرؤية مؤقتًا.|direction=اتجاه؛ lost sight of=فقد من نظره
“There’s a flaw in the system,” Daniel admitted.|“هناك عيب في النظام،” اعترف دانيال.|flaw=عيب، ثغرة
Thomas remained calm. “Every system has defects. What matters is how we respond to them.”|ظل توماس هادئًا: “كل نظام فيه عيوب. المهم هو كيف نتعامل معها.”|respond=يستجيب، يتعامل مع
Daniel corrected the error and managed to locate the leopard again.|صحّح دانيال الخطأ وتمكّن من تحديد موقع الفهد مجددًا.|corrected=صحّح؛ locate=يحدد موقع
The team followed its tracks until they found it resting beneath a tree.|تتبع الفريق آثاره حتى وجدوه يستريح تحت شجرة.|

They approached slowly, without frightening it. Maria placed some food nearby, and the leopard eventually came closer.|اقتربوا ببطء دون أن يخيفوه. وضعت ماريا بعض الطعام قريبًا، وفي النهاية اقترب الفهد.|
Weeks passed, and the animal became stronger.|مرّت أسابيع وصار الحيوان أقوى.|
Its movements were more confident, its appetite improved, and its injured paw gradually recovered.|صارت حركاته أكثر ثقة، وتحسّنت شهيته، وتعافى كفّه المصاب تدريجيًّا.|appetite=شهية
Finally, the day of its release arrived.|وأخيرًا جاء يوم إطلاق سراحه.|release=إطلاق سراح، تحرير
The team opened the gate, and the leopard stood still for a moment.|فتح الفريق البوابة، ووقف الفهد ساكنًا للحظة.|gate=بوابة؛ stood still=وقف ساكنًا
Then, with one quick and agile movement, it disappeared into the forest.|ثم، بحركة سريعة رشيقة واحدة، اختفى في الغابة.|
Daniel gazed after it, feeling completely happy.|حدّق دانيال في أثره وهو يشعر بسعادة كاملة.|gazed after=يتبع بنظره
Thomas placed a hand on his shoulder.|وضع توماس يدًا على كتفه.|shoulder=كتف
“Remember, Daniel,” he said, “our greatest success is not controlling nature. It is learning to respect it.”|“تذكّر يا دانيال،” قال، “أعظم نجاح لنا ليس السيطرة على الطبيعة، بل تعلّم احترامها.”|
And from that day onward, Daniel understood that knowledge, patience, and compassion were far more valuable than any advanced machine.|ومنذ ذلك اليوم، فهم دانيال أن المعرفة والصبر والرحمة أثمن بكثير من أي آلة متقدمة.|from that day onward=منذ ذلك اليوم فصاعدًا؛ compassion=رحمة، شفقة`},
{t:"The Secret of the Ancient Island",x:`For generations, the people of a remote island in the Pacific Ocean had believed that a mysterious organism lived beneath the enormous waves.|لأجيال، آمن سكان جزيرة نائية في المحيط الهادئ بأن كائنًا عضويًّا غامضًا يعيش تحت الأمواج الهائلة.|Pacific Ocean=المحيط الهادئ؛ organism=كائن حي، كائن عضوي؛ enormous=هائل، ضخم
Their ancestors had described it as a strange living thing that could survive in complete darkness.|وصفه أسلافهم بأنه كائن حي غريب يستطيع البقاء في ظلام دامس.|ancestors=أسلاف، أجداد؛ darkness=ظلام

According to an ancient legend, the island’s first male and female inhabitants had discovered the organism near a huge rock.|وفق أسطورة قديمة، اكتشف أول سكان الجزيرة من الرجال والنساء الكائن قرب صخرة ضخمة.|legend=أسطورة؛ inhabitants=سكان؛ huge=ضخم
They believed it was a gift from nature, and they left stories about it behind, handing them down to their offspring and posterity.|اعتقدوا أنه هدية من الطبيعة، وتركوا حكايات عنه ونقلوها إلى ذريتهم وأعقابهم.|gift=هدية؛ handing down=يورّث، ينقل للأجيال؛ offspring=ذرية، نسل؛ posterity=الأجيال اللاحقة، الأعقاب
The legend continued to last for centuries.|واستمرت الأسطورة قرونًا.|last=يدوم، يستمر؛ centuries=قرون
Naturally, many people considered it a primitive superstition.|وبطبيعة الحال، اعتبرها كثيرون خرافة بدائية.|naturally=بطبيعة الحال؛ primitive=بدائي؛ superstition=خرافة
However, an experienced marine biologist named Dr. Elena decided to study the island’s unusual ecosystem.|غير أن عالمة أحياء بحرية خبيرة تُدعى الدكتورة إيلينا قررت دراسة النظام البيئي غير المعتاد للجزيرة.|marine=بحري؛ biologist=عالم أحياء؛ ecosystem=نظام بيئي

“Hey, Captain!” she shouted as the research boat approached the shore. “There must be something unusual beneath those waves!”|“يا كابتن!” صاحت بينما اقترب قارب البحث من الشاطئ. “لا بد أن هناك شيئًا غير معتاد تحت تلك الأمواج!”|captain=قبطان؛ shore=شاطئ، ساحل
The captain described the surrounding sea as noisy and restless.|وصف القبطان البحر المحيط بأنه صاخب ومضطرب.|noisy=صاخب؛ restless=مضطرب، قلق
White noise from the wind, water, and distant machinery filled the air.|ملأ ضجيج أبيض من الرياح والماء والآلات البعيدة الأجواء.|white noise=ضجيج أبيض؛ machinery=آلات
Yet, for no apparent reason, a strange sound disappeared whenever the boat came close to the enormous rock.|ومع ذلك، ودون سبب واضح، كان صوت غريب يختفي كلما اقترب القارب من الصخرة الهائلة.|for no apparent reason=دون سبب واضح

Elena was curious. She approached the rock and gently stroked its rough surface.|كانت إيلينا فضولية. اقتربت من الصخرة ومسّدت سطحها الخشن برفق.|curious=فضولي؛ stroked=مسّد، مسح بلطف؛ rough=خشن؛ surface=سطح
Suddenly, she felt a vibration.|فجأة، شعرت باهتزاز.|vibration=اهتزاز
“That must be a signal,” she whispered.|“لا بد أن هذه إشارة،” همست.|signal=إشارة
Her assistant, Marco, had no alternative but to agree.|لم يكن أمام مساعدها ماركو خيار سوى الموافقة.|no alternative but=لا بديل سوى، لا خيار سوى
In view of the strange phenomenon, they decided to investigate the area more carefully.|نظرًا إلى الظاهرة الغريبة، قررا فحص المنطقة بعناية أكبر.|in view of=نظرًا إلى، بالنظر إلى؛ phenomenon=ظاهرة؛ investigate=يحقق في، يستقصي

They lowered a special device into the water.|أنزلا جهازًا خاصًا في الماء.|lowered=أنزل؛ device=جهاز
Its purpose was to expose hidden movements and reveal what ordinary cameras could not depict.|كان هدفه كشف الحركات الخفية وإظهار ما لا تستطيع الكاميرات العادية تصويره.|purpose=هدف، غاية؛ expose=يكشف، يعرّض؛ hidden=خفي؛ depict=يصوّر، يرسم
The screen showed a strange organism moving beneath the waves.|أظهرت الشاشة كائنًا غريبًا يتحرك تحت الأمواج.|
It had nerves, a complex internal structure, and several unusual symptoms of biological activity.|كان له أعصاب وبنية داخلية معقدة وعدة أعراض غير معتادة لنشاط حيوي.|nerves=أعصاب؛ internal=داخلي؛ structure=بنية، هيكل؛ symptoms=أعراض؛ biological=حيوي، بيولوجي
It seemed to evolve over time, adapting to changes in its environment.|بدا أنه يتطور مع الزمن، متكيّفًا مع تغيرات بيئته.|evolve=يتطور؛ adapting=يتكيّف

Elena explained that the organism might have developed from a primeval form of life.|شرحت إيلينا أن الكائن ربما تطور من شكل بدائي قديم جدًّا من الحياة.|primeval=أولي، قديم جدًّا، من فجر التاريخ
Its ancestors had probably survived through natural selection, while weaker organisms had been eliminated through competition.|على الأرجح نجا أسلافه عبر الانتخاب الطبيعي، بينما أُقصيت الكائنات الأضعف بالمنافسة.|natural selection=الانتخاب الطبيعي؛ eliminated=أُقصي، استُبعد؛ competition=منافسة
“Evolution does not happen for no reason,” she explained.|“التطور لا يحدث بلا سبب،” شرحت.|evolution=تطور، نشوء
“Every change has a cause, even if that cause is not immediately apparent.”|“لكل تغيير سبب، حتى لو لم يكن ذلك السبب واضحًا على الفور.”|apparent=واضح، ظاهر

Marco pointed out that the organism seemed to respond to sound.|أشار ماركو إلى أن الكائن بدا مستجيبًا للصوت.|pointed out=يشير إلى، ينبّه إلى
He suggested that certain frequencies might prompt it to approach the surface.|اقترح أن بعض الترددات قد تدفعه إلى الاقتراب من السطح.|frequencies=ترددات؛ prompt=يحفّز، يدفع
There was no harm in testing the theory, so Elena played a low-frequency signal through the device.|لم يكن هناك ضرر من اختبار النظرية، فشغّلت إيلينا إشارة منخفضة التردد عبر الجهاز.|no harm in=لا ضرر من؛ low-frequency=منخفض التردد
Immediately, the organism approached.|فورًا، اقترب الكائن.|
“Hey! Look at that!” Marco called out.|“انظري إلى ذلك!” نادى ماركو.|called out=ينادي، يصيح
The creature rose slowly toward the surface, revealing a beautiful pattern of light across its body.|ارتفع المخلوق ببطء نحو السطح، كاشفًا عن نمط جميل من الضوء عبر جسده.|rose=ارتفع؛ revealing=يكشف

Elena was amazed by its effect on the surrounding environment.|دُهشت إيلينا من تأثيره في البيئة المحيطة.|amazed=مندهش
The organism seemed to relieve the water of harmful substances, helping other living things survive.|بدا أن الكائن يخلّص الماء من المواد الضارة، مما يساعد الكائنات الحية الأخرى على البقاء.|relieve=يخلّص، يخفّف؛ harmful=ضار؛ substances=مواد
However, the discovery caused trouble.|غير أن الاكتشاف جلب المتاعب.|trouble=متاعب، مشكلة
A powerful company wanted to capture the organism and use it for commercial purposes.|أرادت شركة قوية أسر الكائن واستخدامه لأغراض تجارية.|powerful=قوي، نافذ؛ commercial=تجاري
Its representatives offered the researchers a large amount of money in exchange for exclusive access.|عرض ممثلوها على الباحثين مبلغًا كبيرًا من المال مقابل وصول حصري.|representatives=ممثلون؛ in exchange for=مقابل؛ exclusive=حصري؛ access=وصول
Elena refused.|رفضت إيلينا.|

She knew that exposing the organism to uncontrolled experiments could cause serious harm.|كانت تعلم أن تعريض الكائن لتجارب غير منضبطة قد يسبب ضررًا جسيمًا.|uncontrolled=غير منضبط، بلا ضوابط؛ experiments=تجارب؛ harm=ضرر
In light of its unusual biological importance, protecting it was more important than making money.|في ضوء أهميته البيولوجية غير المعتادة، كانت حمايته أهم من كسب المال.|in light of=في ضوء؛ importance=أهمية
The company continued to put pressure on the research team.|واصلت الشركة الضغط على فريق البحث.|put pressure on=يضغط على
Its representatives tried to reveal private information about the scientists and create obstacles to their work.|حاول ممثلوها كشف معلومات خاصة عن العلماء وخلق عقبات أمام عملهم.|reveal=يكشف؛ private=خاص، شخصي؛ scientists=علماء؛ obstacles=عقبات
Marco became nervous. He had a spouse and a young child, and he feared that the company might threaten his family.|أصيب ماركو بالتوتر. كان له شريك حياة وطفل صغير، وخشي أن تهدد الشركة عائلته.|spouse=زوج أو زوجة، شريك الحياة
Elena reassured him. “We must not act against our conscience. There is no alternative but to protect this discovery.”|طمأنته إيلينا: “يجب ألا نتصرف ضد ضميرنا. لا بديل عن حماية هذا الاكتشاف.”|act against=يتصرف ضد

A few days later, Elena developed a mysterious disease.|بعد أيام قليلة، أصيبت إيلينا بمرض غامض.|developed=أصيب بـ، نشأ لديه؛ disease=مرض
She experienced severe symptoms and became a patient at the island’s small medical center.|عانت أعراضًا شديدة وأصبحت مريضة في المركز الطبي الصغير بالجزيرة.|experienced=مرّ بـ، عانى؛ patient=مريض
The doctor prescribed an auxiliary treatment to relieve her pain.|وصف الطبيب علاجًا مساعدًا لتخفيف ألمها.|prescribed=وصف (دواء)؛ auxiliary=مساعد، إضافي؛ pain=ألم
Fortunately, she gradually recovered and was eventually cured.|لحسن الحظ، تعافت تدريجيًّا وشُفيت في النهاية.|cured=شُفي
During her recovery, she continued to think about the organism’s remarkable efficacy.|أثناء تعافيها، واصلت التفكير في الفعالية الرائعة للكائن.|recovery=تعافٍ؛ remarkable=رائع، لافت؛ efficacy=فعالية، نجاعة
She realized that it might offer new ways to treat certain illnesses.|أدركت أنه قد يوفّر طرقًا جديدة لعلاج بعض الأمراض.|treat=يعالج؛ illnesses=أمراض
But she also understood that more research was necessary.|لكنها أدركت أيضًا أن المزيد من البحث ضروري.|research=بحث، أبحاث؛ necessary=ضروري

The team eventually published its findings, describing the organism and its possible medical applications.|نشر الفريق في النهاية نتائجه، واصفًا الكائن وتطبيقاته الطبية المحتملة.|published=نشر؛ findings=نتائج، اكتشافات؛ applications=تطبيقات
They offered their research to the scientific community rather than selling the discovery to the company.|قدّموا بحثهم للمجتمع العلمي بدلًا من بيع الاكتشاف للشركة.|scientific=علمي
The island’s people were proud. Their ancestors’ old stories had turned out to contain an important truth.|شعر أهل الجزيرة بالفخر. تبيّن أن حكايات أسلافهم القديمة تحتوي على حقيقة مهمة.|turned out=يتبيّن، يظهر في النهاية
And Elena learned that the greatest discoveries were not always those that could be owned.|وتعلّمت إيلينا أن أعظم الاكتشافات ليست دائمًا ما يمكن امتلاكه.|
Sometimes, their real value lay in what they could give to the world.|أحيانًا تكمن قيمتها الحقيقية فيما يمكن أن تقدمه للعالم.|lay in=تكمن في`},
{t:"The Forgotten Harbor",x:`For centuries, the small coastal town of Puerto Escondido had undergone many changes.|على مدى قرون، شهدت بلدة بويرتو إسكونديدو الساحلية الصغيرة تغيّرات كثيرة.|coastal=ساحلي؛ undergo=يمرّ بـ، يخضع لـ
At first, its people lived solely by fishing, and several families had migrated there from remote villages.|في البداية، عاش أهلها على صيد السمك وحده، وهاجرت إليها عدة عائلات من قرى نائية.|solely=حصريًّا، وحده؛ fishing=صيد السمك؛ migrated=يهاجر، ينتقل
They had learned to survive the harsh weather and the many vicissitudes of life.|تعلّموا النجاة من الطقس القاسي ومن تقلّبات الحياة الكثيرة.|harsh=قاسٍ، شديد؛ vicissitudes=تقلبات، صروف الدهر

All along the coast, ancient settlements could be found.|على امتداد الساحل، يمكن العثور على مستوطنات قديمة.|all along=على امتداد؛ coast=ساحل؛ settlements=مستوطنات، تجمعات سكنية
Their remains were scattered everywhere, but modern buildings and busy industries had begun to encroach on the historical sites.|كانت بقاياها منتشرة في كل مكان، لكن المباني الحديثة والصناعات النشطة بدأت تتعدّى على المواقع التاريخية.|remains=بقايا، آثار؛ scattered=متناثر، منتشر؛ encroach on=يتعدّى على، يتجاوز على؛ historical=تاريخي
The town’s elders feared that these developments might destroy an essential part of their humanity and cultural identity.|خشي كبار البلدة أن تدمّر هذه التطورات جزئًا أساسيًّا من إنسانيتهم وهويتهم الثقافية.|developments=تطورات؛ cultural=ثقافي

One day, a young historian named Elena arrived at the old wharf carrying a compass, several books, and a small tent.|في يوم ما، وصلت مؤرخة شابة تُدعى إيلينا إلى الرصيف القديم تحمل بوصلة وعدة كتب وخيمة صغيرة.|historian=مؤرخ؛ wharf=رصيف الميناء؛ compass=بوصلة؛ tent=خيمة
Her aim was to conduct archaeological studies in the remote coastal region.|كان هدفها إجراء دراسات أثرية في المنطقة الساحلية النائية.|aim=هدف؛ conduct=يجري، يُدير؛ archaeological=أثري
She wanted to discover how ancient people had lived, navigated the sea, and traded with neighboring communities.|أرادت اكتشاف كيف عاش القدماء وأبحروا في البحر وتاجروا مع المجتمعات المجاورة.|navigate=يبحر، يهتدي في الطريق؛ trade=يتاجر؛ neighboring=مجاور

Elena had received some funds from a cultural foundation.|كانت إيلينا قد تلقّت بعض التمويل من مؤسسة ثقافية.|funds=أموال، تمويل؛ foundation=مؤسسة، مؤسسة خيرية
However, her budget was limited, so she hired a local guide and rented a small boat.|غير أن ميزانيتها كانت محدودة، فاستأجرت مرشدًا محليًّا وقاربًا صغيرًا.|budget=ميزانية؛ hired=استأجر (شخصًا)، وظّف؛ guide=مرشد، دليل؛ rented=استأجر
The guide was also an adviser who knew the local conditions and customs, including the traditions and religion of the people who once dwelled there.|وكان المرشد أيضًا مستشارًا يعرف الأوضاع والعادات المحلية، بما فيها تقاليد ودين من سكنوا هناك يومًا.|adviser=مستشار؛ conditions=أوضاع، ظروف؛ customs=عادات؛ traditions=تقاليد؛ religion=دين؛ dwelled=يسكن، يقيم
“Here, history is not found in books alone,” the guide explained. “You must understand the people and their way of life.”|“هنا، لا يوجد التاريخ في الكتب وحدها،” شرح المرشد. “عليك أن تفهمي الناس ونمط حياتهم.”|history=تاريخ

Elena began her work by every possible means.|بدأت إيلينا عملها بكل وسيلة ممكنة.|by every possible means=بكل وسيلة ممكنة
She used satellite images to locate ancient roads and learned how to navigate the dangerous coastline.|استخدمت صور الأقمار الصناعية لتحديد الطرق القديمة وتعلّمت كيف تتنقل عبر الساحل الخطير.|satellite=قمر صناعي؛ coastline=خط الساحل
Her guide showed her a hidden path leading to an abandoned settlement.|أراها مرشدها طريقًا خفيًّا يؤدي إلى مستوطنة مهجورة.|path=مسار، درب

The town was once a bustling port, where merchants carried goods from distant countries.|كانت البلدة يومًا ميناءً نابضًا بالحياة، حيث ينقل التجار بضائع من بلدان بعيدة.|port=ميناء؛ merchants=تجار؛ goods=بضائع
Its prosperity had caused a sensation throughout the region.|أحدث ازدهارها ضجة في أرجاء المنطقة.|prosperity=ازدهار، رخاء؛ cause a sensation=يُحدث ضجة، يثير إعجابًا واسعًا
A famous public figure had even visited the harbor, and a newspaper column had described the event in a brief and concise article.|بل زار الميناء شخصية عامة مشهورة، ووصفت زاوية صحفية الحدث في مقال موجز ومختصر.|public figure=شخصية عامة؛ column=عمود صحفي؛ brief=موجز؛ concise=مختصر، دقيق ومقتضب

Years later, several editions of books about the town were published.|بعد سنوات، نُشرت عدة طبعات من كتب عن البلدة.|editions=طبعات
One special edition came out with a preface written by a respected historian.|صدرت طبعة خاصة بمقدمة كتبها مؤرخ محترم.|came out=صدر، ظهر؛ preface=مقدمة (كتاب)
The books were issued and distributed to schools and libraries, bringing new interest and delight to readers.|أُصدرت الكتب ووُزّعت على المدارس والمكتبات، مما جلب اهتمامًا جديدًا ومتعة للقراء.|issued=أُصدر؛ delight=بهجة، متعة؛ readers=قراء

But Elena discovered something more important: an ancient inscription describing a forgotten undertaking.|لكن إيلينا اكتشفت شيئًا أهم: نقشًا قديمًا يصف مشروعًا منسيًّا.|inscription=نقش، كتابة منقوشة؛ undertaking=مشروع، مهمة كبرى؛ forgotten=منسي
It seemed as if the people had built a great system to protect their harbor and revitalize their local industry.|بدا كأن الناس بنوا نظامًا عظيمًا لحماية ميناءهم وإحياء صناعتهم المحلية.|revitalize=يعيد الحيوية، ينعش
The project had extended for miles along the coast, and its purpose was to help the town prosper.|امتد المشروع أميالًا على طول الساحل، وكان غرضه مساعدة البلدة على الازدهار.|extend=يمتد؛ miles=أميال؛ prosper=يزدهر
The historian’s adviser believed that this discovery could become the mainstream of a new historical exhibition.|آمن مستشار المؤرخة بأن هذا الاكتشاف قد يصبح المحور الرئيسي لمعرض تاريخي جديد.|mainstream=التيار الرئيسي، المحور الأساسي؛ exhibition=معرض

When Elena finally returned to the town, she wrote a concise report.|حين عادت إيلينا أخيرًا إلى البلدة، كتبت تقريرًا موجزًا.|
She explained that the old customs were not merely traditions from the past; they were an important part of human nature and collective memory.|شرحت أن العادات القديمة ليست مجرد تقاليد من الماضي، بل جزء مهم من الطبيعة البشرية والذاكرة الجماعية.|merely=مجرد، فحسب؛ human nature=الطبيعة البشرية؛ collective=جماعي
Her report made a great stir when it was published.|أحدث تقريرها ضجة كبيرة عند نشره.|make a stir=يثير ضجة
The local people welcomed the attention, and the town began to attract visitors once again.|رحّب السكان المحليون بالاهتمام، وبدأت البلدة تجذب الزوار من جديد.|visitors=زوار
Elena had come to study an ancient harbor, but she had discovered that preserving history was also a way of protecting humanity.|جاءت إيلينا لدراسة ميناء قديم، لكنها اكتشفت أن حفظ التاريخ هو أيضًا طريقة لحماية الإنسانية.|`},
{t:"Across the Frozen Frontier",x:`At the beginning of winter, a scientific expedition prepared to travel toward the North Pole.|في بداية الشتاء، استعدّت بعثة علمية للسفر نحو القطب الشمالي.|expedition=بعثة استكشافية، رحلة استكشاف؛ North Pole=القطب الشمالي
Its leader, Captain Robert Hayes, was a typical example of a persistent and persevering explorer.|كان قائدها، الكابتن روبرت هايز، مثالًا نموذجيًّا للمستكشف المثابر والصبور.|typical=نموذجي، تقليدي؛ persistent=مثابر، مُصرّ؛ persevering=صبور، مواظب؛ explorer=مستكشف
He had a strong background in geography and years of previous experience working in remote regions.|كانت لديه خلفية قوية في الجغرافيا وسنوات من الخبرة السابقة في العمل بالمناطق النائية.|background=خلفية؛ geography=جغرافيا

Before departure, he reviewed the expedition’s special topic: how climate change was affecting the Arctic environment.|قبل المغادرة، راجع الموضوع الخاص بالبعثة: كيف يؤثر تغيّر المناخ في البيئة القطبية الشمالية.|departure=مغادرة، رحيل؛ reviewed=راجع؛ topic=موضوع؛ climate change=تغيّر المناخ؛ Arctic=القطب الشمالي، قطبي
He investigated old records, observed animal behavior, and interviewed several researchers who had visited the region.|فحص سجلات قديمة، وراقب سلوك الحيوانات، وأجرى مقابلات مع عدة باحثين زاروا المنطقة.|observed=راقب؛ interviewed=أجرى مقابلة مع

His main post was to lead the team, but he also had to comment on their findings and record every important observation.|كان منصبه الرئيسي قيادة الفريق، لكن كان عليه أيضًا التعليق على نتائجهم وتسجيل كل ملاحظة مهمة.|post=منصب، موقع؛ lead=يقود؛ comment on=يعلّق على؛ record=يسجّل
He firmly believed that knowledge was only useful when people paid attention to it and acted upon it.|كان يؤمن بشدة بأن المعرفة لا تنفع إلا حين ينتبه لها الناس ويعملون بها.|firmly=بحزم، بثبات؛ pay attention to=ينتبه لـ؛ act upon=يعمل بمقتضى

The journey was not easy. The team had to open up a new route across an unexplored area, and every decision had to be within their power and ability.|لم تكن الرحلة سهلة. كان على الفريق شقّ طريق جديد عبر منطقة غير مستكشفة، وكان على كل قرار أن يكون في حدود قدرتهم وطاقتهم.|open up=يشقّ، يفتح؛ route=طريق، مسار؛ unexplored=غير مستكشف؛ within one’s power=في حدود قدرته
They packed their clothing, food, medical supplies, and scientific equipment into strong packages.|حزموا ملابسهم وطعامهم ومؤنهم الطبية ومعداتهم العلمية في طرود متينة.|packed=حزم، عبّأ؛ supplies=مؤن، إمدادات؛ packages=طرود، حزم
Their guide explained that the chains connecting their equipment had to be checked carefully.|شرح مرشدهم أن السلاسل التي تربط معداتهم ينبغي فحصها بعناية.|chains=سلاسل؛ connecting=يربط، يصل

One evening, the team encountered a terrible storm.|في مساء ما، واجه الفريق عاصفة مروعة.|encountered=واجه، صادف؛ storm=عاصفة
The temperature dropped to a severe cold, and the explorers became tired and weary.|انخفضت الحرارة إلى برد قارس، وأصاب المستكشفين التعب والإرهاق.|temperature=درجة الحرارة؛ dropped=انخفض؛ weary=مرهق، متعب
A married couple in the group struggled to protect their supplies.|كافح زوجان في المجموعة لحماية مؤنهما.|married couple=زوجان
They tied up the equipment to prevent it from being scattered by the wind.|ربطا المعدات لمنعها من أن تتبعثر بفعل الرياح.|tied up=ربط، شدّ

Suddenly, a loud noise came from behind a hill.|فجأة، جاء ضجيج عالٍ من خلف تل.|loud=عالٍ (صوت)
A researcher was amazed to discover that a rescue vehicle had become trapped beneath a pile of ice.|دُهش أحد الباحثين حين اكتشف أن مركبة إنقاذ علقت تحت كومة من الجليد.|vehicle=مركبة؛ trapped=محاصر، عالق؛ pile=كومة؛ ice=جليد
The disaster was urgent and could brook no delay.|كانت الكارثة عاجلة ولا تحتمل أي تأخير.|disaster=كارثة؛ brook=يحتمل، يتسامح مع؛ delay=تأخير
Captain Hayes stirred up the team to act quickly.|حثّ الكابتن هايز الفريق على التحرك بسرعة.|stir up=يحرّض، يحفّز، يثير
His instinct told him that someone might still be inside.|أخبره حدسه أن أحدًا قد يكون لا يزال بالداخل.|instinct=غريزة، حدس
They crossed a frozen river and seized a rope attached to the vehicle.|عبروا نهرًا متجمدًا وأمسكوا بحبل متصل بالمركبة.|frozen=متجمد؛ seize=يمسك بقوة، يستولي على؛ rope=حبل؛ attached=متصل
After several attempts, they managed to release the trapped driver and rescue him.|بعد عدة محاولات، تمكنوا من تحرير السائق العالق وإنقاذه.|attempts=محاولات؛ driver=سائق

The driver was hungry and exhausted.|كان السائق جائعًا ومنهكًا.|
He explained that he had been traveling along a route that cut across the frozen landscape when his vehicle broke down.|شرح أنه كان يسافر على طريق يقطع المشهد المتجمد حين تعطّلت مركبته.|cut across=يقطع، يعبر؛ broke down=تعطّل
He had suffered from diarrhea after drinking unsafe water and had barely been able to continue.|كان قد عانى من الإسهال بعد شرب ماء غير آمن وبالكاد استطاع المواصلة.|diarrhea=إسهال؛ unsafe=غير آمن
The team gave him food and warm clothes.|أعطاه الفريق طعامًا وملابس دافئة.|clothes=ملابس
They also helped him control his breathing and recover from the shock.|وساعدوه أيضًا على التحكم في تنفسه والتعافي من الصدمة.|shock=صدمة
Hayes wrote down the details of the incident so that future explorers could avoid the same danger.|دوّن هايز تفاصيل الحادثة كي يتجنب المستكشفون في المستقبل الخطر نفسه.|wrote down=دوّن، سجّل؛ avoid=يتجنب

Later, the team discussed the difference between instinct and impulse.|لاحقًا، ناقش الفريق الفرق بين الغريزة والاندفاع.|difference=فرق؛ impulse=اندفاع، دافع مفاجئ
Instinct had helped them recognize danger, while an uncontrolled impulse could have made the situation worse.|ساعدتهم الغريزة على إدراك الخطر، بينما كان الاندفاع غير المنضبط ليزيد الوضع سوءًا.|recognize=يتعرّف على، يدرك

Their expedition expenses were higher than expected.|كانت مصاريف بعثتهم أعلى من المتوقع.|expected=متوقع
They had to make careful calculations and follow strict budgeting.|كان عليهم إجراء حسابات دقيقة والتزام ميزنة صارمة.|calculations=حسابات؛ strict=صارم؛ budgeting=وضع الميزانية، ضبط الإنفاق
They reduced unnecessary expenditure and spending, and used part of their savings and deposits to cover the emergency costs.|قلّلوا النفقات غير الضرورية والإنفاق، واستخدموا جزءًا من مدخراتهم وودائعهم لتغطية تكاليف الطوارئ.|unnecessary=غير ضروري؛ expenditure=نفقات؛ spending=إنفاق؛ savings=مدخرات؛ deposits=ودائع؛ emergency=طوارئ
They agreed to make do with limited supplies and put up with difficult conditions.|اتفقوا على الاكتفاء بمؤن محدودة وتحمّل ظروف صعبة.|put up with=يتحمّل، يصبر على
Their goal was to complete the journey without allowing the storm to dominate their minds.|كان هدفهم إتمام الرحلة دون السماح للعاصفة بالسيطرة على عقولهم.|goal=هدف؛ dominate=يهيمن على، يسيطر على

As they approached the equator on their return journey, the weather became warmer.|وبينما اقتربوا من خط الاستواء في رحلة العودة، صار الطقس أدفأ.|equator=خط الاستواء؛ return journey=رحلة العودة
They came across an old research station filled with antique and outdated equipment.|صادفوا محطة أبحاث قديمة مليئة بمعدات أثرية وعتيقة.|come across=يصادف، يعثر على؛ station=محطة؛ antique=أثري، عتيق؛ outdated=قديم، عفا عليه الزمن
The team decided to donate the usable items to a museum.|قرر الفريق التبرع بالأغراض الصالحة للاستخدام إلى متحف.|donate=يتبرع؛ usable=صالح للاستخدام؛ museum=متحف
At the summit of their achievement, Captain Hayes looked back at the expedition.|عند قمة إنجازهم، نظر الكابتن هايز إلى الوراء نحو البعثة.|summit=قمة، ذروة
He was surprised by how much the team had learned.|تفاجأ بمقدار ما تعلّمه الفريق.|
The journey had shown them that courage was not the absence of fear, but the ability to act wisely despite it.|أظهرت لهم الرحلة أن الشجاعة ليست غياب الخوف، بل القدرة على التصرف بحكمة رغمه.|despite=رغم، بالرغم من؛ wisely=بحكمة
The explorers returned home safely, determined to share their findings and help others understand the fragile Arctic environment.|عاد المستكشفون إلى الوطن بسلام، عازمين على مشاركة نتائجهم ومساعدة الآخرين على فهم البيئة القطبية الهشّة.|safely=بسلام، بأمان؛ fragile=هش، سريع الكسر`}];

const seen=new Set();
const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
const L=D.map(d=>d.x.split("\n\n").map(p=>p.split("\n").map(l=>{
 const [en,ar,v]=l.split("|");
 const w=(v||"").split("؛").map(s=>s.trim()).filter(Boolean).map(s=>{const i=s.indexOf("=");return[s.slice(0,i),s.slice(i+1)]}).filter(([k])=>{const q=k.toLowerCase();if(seen.has(q))return false;seen.add(q);return true});
 return{en,ar,w}})));
const app=document.getElementById("app"),R=document.documentElement;
function home(){app.innerHTML='<h1>📖 اختر الدرس</h1><div class="home">'+D.map((d,i)=>`<div class="hb"><button class="c" onclick="lesson(${i})">${i+1}</button>${d.t}</div>`).join("")+"</div>"}
function hl(en,w){let h=en.replace(/&/g,"&amp;").replace(/</g,"&lt;");w.forEach(([k])=>{h=h.replace(new RegExp("(^|[^\\w>])("+esc(k.replace(/’/g,"'")).replace(/'/g,"['’]")+")(?![\\w])","i"),"$1<mark>$2</mark>")});return h}
function lesson(i){let n=0;app.innerHTML=`<button class="back" onclick="home()">→ الرجوع</button><div class="hd">الدرس ${i+1}<h1>${D[i].t}</h1></div>`+L[i].map((p,pi)=>`<div class="pt">فقرة ${pi+1}</div>`+p.map(s=>{n++;return`<div class="s"><span class="n">${n}</span><button class="sp" onclick="say(this.parentNode.querySelector('.en').textContent)">🔊</button><div class="en">${hl(s.en,s.w)}</div><div class="ar">${s.ar}</div>${s.w.length?`<div class="v">${s.w.map(([a,b])=>`<div onclick="say(this.firstChild.textContent)"><b>${a}</b>${b}</div>`).join("")}</div>`:""}</div>`}).join("")).join("");scrollTo(0,0)}
const bt=document.getElementById("bt");
function setT(t){R.dataset.theme=t;bt.textContent=t=="dark"?"☀":"☾"}
try{setT(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){setT("light")}
bt.onclick=()=>setT(R.dataset.theme=="dark"?"light":"dark");
function tg(id,c){const b=document.getElementById(id);b.onclick=()=>b.classList.toggle("off",document.body.classList.toggle(c))}
tg("ba","hide-ar");tg("be","hide-en");
let V=null;
function pick(){const a=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));V=a.find(v=>v.localService)||a[0]||null}
if("speechSynthesis" in window){speechSynthesis.onvoiceschanged=pick;pick()}
function say(t){if(!("speechSynthesis" in window)){alert("جهازك مش بيدعم النطق هنا");return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";if(V)u.voice=V;u.rate=.85;speechSynthesis.speak(u)}
home();
</script></body></html>
