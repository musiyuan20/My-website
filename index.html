<style>
:root{--bg:#f3f5fa;--card:#fff;--tx:#1b1f2a;--mu:#5b6478;--ac:#4f46e5;--ac2:#eef0ff;--bd:#e1e5ef;--mk:#fff3b0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1117;--card:#1a1d27;--tx:#ecefff;--mu:#a3abc2;--ac:#8b94ff;--ac2:#242850;--bd:#2c3042;--mk:#5a4d00;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1117;--card:#1a1d27;--tx:#ecefff;--mu:#a3abc2;--ac:#8b94ff;--ac2:#242850;--bd:#2c3042;--mk:#5a4d00;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.7 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);display:flex;gap:16px;justify-content:center;padding:10px;z-index:5;border-bottom:1px solid var(--bd)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.c{width:48px;height:48px;border-radius:50%;border:2px solid var(--ac);background:var(--card);color:var(--ac);font-size:19px;font-weight:700;cursor:pointer;box-shadow:0 2px 6px #0002}
.c.off{background:var(--ac);color:#fff;text-decoration:line-through}
.wrap{max-width:740px;margin:0 auto;padding:14px}
h1{text-align:center;font-size:23px;margin:18px 0}
.home{display:flex;gap:26px;justify-content:center;flex-wrap:wrap;margin-top:30px}
.hb{text-align:center;max-width:150px;font-size:14px;color:var(--mu);direction:ltr}
.hb .c{width:96px;height:96px;font-size:38px;display:block;margin:0 auto 8px;background:linear-gradient(135deg,var(--ac),#9b6bff);color:#fff;border:0}
.back{background:none;border:0;color:var(--ac);font-size:16px;cursor:pointer}
.hd{background:linear-gradient(135deg,var(--ac),#9b6bff);color:#fff;border-radius:18px;padding:16px;text-align:center;margin:8px 0 16px}
.hd h1{margin:4px 0;color:#fff;font-size:21px;direction:ltr}
.pt{margin:22px 0 8px;color:var(--ac);font-weight:700;font-size:15px;display:flex;align-items:center;gap:10px}
.pt::after{content:"";flex:1;height:1px;background:var(--bd)}
.s{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 1px 4px #0001}
.n{display:inline-block;background:var(--ac2);color:var(--ac);border-radius:10px;padding:0 9px;font-size:13px;font-weight:700;margin-bottom:4px}
.en{direction:ltr;text-align:left;font-size:19px;font-weight:500}
.ar{direction:rtl;text-align:right;color:var(--mu);margin-top:6px;padding-top:6px;border-top:1px dashed var(--bd)}
mark{background:var(--mk);color:inherit;border-radius:4px;padding:0 2px}
.v{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:10px}
.v div{background:var(--ac2);border-radius:10px;padding:6px 10px;font-size:15px;line-height:1.45}
.v b{display:block;direction:ltr;text-align:left;color:var(--ac)}
.sp{float:left;margin-right:8px;width:34px;height:34px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:16px;cursor:pointer}.v div{cursor:pointer}
.hide-ar .ar{display:none}.hide-en .en{display:none}
</style></head><body>

{t:"A Gentleman, His Family, and His Career",x:`During his term of office, Mr. Adam became a respected manager.|خلال فترة منصبه، أصبح السيد آدم مديرًا محترمًا.|term of office=فترة المنصب، مدة الولاية؛ respected=محترم، موقّر؛ manager=مدير

One day, he received an important revelation that changed his understanding of leadership.|في يوم من الأيام، تلقّى كشفًا مهمًا غيّر فهمه للقيادة.|revelation=كشف، اكتشاف مفاجئ، وحي؛ leadership=قيادة؛ understanding=فهم، إدراك

During meetings, he encouraged everyone to speak freely.|خلال الاجتماعات، كان يشجّع الجميع على الكلام بحرية.|encourage=يشجّع؛ freely=بحرية
If someone had a doubt or felt confusion, he would ask a question in reply to understand the situation better.|وإذا كان لدى أحدهم شك أو شعر بالارتباك، كان يطرح سؤالًا ردًّا عليه ليفهم الموقف أفضل.|doubt=شك، ريبة؛ confusion=ارتباك، حيرة؛ in reply=ردًّا على ذلك، في المقابل
Sometimes, employees tried to refute his decisions or retort angrily, but he remained calm.|وأحيانًا حاول الموظفون دحض قراراته أو الرد بغضب، لكنه ظل هادئًا.|refute=يدحض، يفنّد؛ retort=يردّ بحدّة؛ angrily=بغضب؛ remain calm=يبقى هادئًا

He believed that a close and intimate relationship between colleagues was important.|وكان يؤمن بأن العلاقة الوثيقة الحميمة بين الزملاء مهمة.|close=وثيق، قريب؛ intimate=حميم؛ colleagues=زملاء

One of them began to pour out his complaints in a steady flow of words.|بدأ أحدهما يسكب شكاواه في سيل متواصل من الكلمات.|pour out=يسكب، يفرغ؛ complaints=شكاوى؛ steady flow=تدفّق متواصل
The other tried to make fun of him.|وحاول الآخر السخرية منه.|make fun of=يسخر من، يتهكم على
Mr. Adam immediately intervened and reminded them that they should respect other people and never insult anyone to their face or in their presence.|تدخّل السيد آدم فورًا وذكّرهما بأن عليهما احترام الآخرين وألّا يهينوا أحدًا في وجهه أو بحضوره.|intervene=يتدخل؛ remind=يذكّر؛ respect=يحترم، احترام؛ insult=يهين، يسيء إلى؛ to one’s face=في وجهه، مباشرة؛ in one’s presence=بحضوره

Another employee decided to echo the manager’s advice and chime in with his opinion.|قرر موظف آخر أن يردّد نصيحة المدير ويشارك برأيه.|echo=يردّد، يكرّر؛ chime in=يشارك بالكلام، يتدخل برأيه

He also wanted to initiate new employees into the basics of their jobs and impart elementary knowledge to beginners.|كما أراد أن يُدخل الموظفين الجدد في أساسيات وظائفهم ويمنح المبتدئين معرفة أولية.|initiate=يُدخل، يلقّن أساسيات؛ basics=أساسيات؛ impart=ينقل، يمنح (معرفة)؛ elementary=أولي، ابتدائي؛ beginners=مبتدئون

He was always honest with her and never hesitated to express his feelings.|كان دائمًا صادقًا معها ولا يتردد في التعبير عن مشاعره.|hesitate=يتردد، يتلكأ؛ express=يعبّر عن؛ feelings=مشاعر، أحاسيس
He believed that a successful life required not only hard work but also love, respect, patience, and understanding.|وكان يؤمن بأن الحياة الناجحة تتطلب لا العمل الجاد فقط، بل الحب والاحترام والصبر والتفاهم أيضًا.|require=يتطلب، يستلزم؛ patience=صبر، أناة`},

{t:"The Last Letter: A Journey Through Time and Tears",x:`Daniel was a young man with a kindly and amiable personality.|كان دانيال شابًا ذا شخصية لطيفة ودودة.|kindly=لطيف، طيّب القلب؛ amiable=ودود، حسن المعشر؛ personality=شخصية

He was dying to see her again and could hardly wait for the moment when they would meet.|كان يتحرّق شوقًا لرؤيتها ولا يكاد يصبر حتى لحظة لقائهما.|dying to=يتحرّق شوقًا لـ؛ could hardly wait=بالكاد يصبر، لا يطيق الانتظار

One day, while sitting beside an old window, she began to brew a cup of tea and deliberate upon the past.|وفي يوم، وهي جالسة بجانب نافذة قديمة، بدأت تعدّ كوب شاي وتتأمل الماضي مليًّا.|brew=يحضّر (الشاي)، يخمّر؛ deliberate upon=يتأمل في، يفكر مليًّا في
She wondered whether Daniel still remembered her.|تساءلت هل ما زال دانيال يتذكرها.|wonder=يتساءل، يتعجب
A sudden memory brought tears to her eyes, and she couldn’t help crying.|أتت ذكرى مفاجئة بالدموع إلى عينيها، ولم تستطع منع نفسها من البكاء.|sudden=مفاجئ، فجائي؛ tears=دموع؛ couldn’t help=لا تستطيع منع نفسها من

Her face showed the marks of time.|ظهرت على وجهها آثار الزمن.|marks of time=آثار الزمن، علامات التقدّم في العمر
A small wrinkle appeared near her eyes, but her smile remained warm.|ظهرت تجعيدة صغيرة قرب عينيها، لكن ابتسامتها بقيت دافئة.|wrinkle=تجعيدة؛ warm=دافئ
She was finally gratified and satisfied with the strength she had discovered within herself.|وأخيرًا كانت مسرورة وراضية عن القوة التي اكتشفتها في داخلها.|gratified=مسرور، مغتبط؛ satisfied=راضٍ، مقتنع؛ strength=قوة
Meanwhile, Daniel had begun to plan a new life.|في الأثناء، كان دانيال قد بدأ يخطط لحياة جديدة.|meanwhile=في الأثناء، في هذه الأثناء
He wanted to find her, but he knew that some wounds needed time to heal.|أراد أن يجدها، لكنه عرف أن بعض الجروح تحتاج وقتًا لتلتئم.|wound=جرح؛ heal=يلتئم، يُشفى
He had developed the ability and capability to forgive, understand, and make allowances for people’s mistakes.|وقد نمّى القدرة على التسامح والفهم وإيجاد الأعذار لأخطاء الناس.|capability=قدرة، كفاءة؛ forgive=يغفر، يسامح؛ make allowances for=يلتمس العذر لـ، يتغاضى عن؛ mistakes=أخطاء

Suddenly, a familiar voice called his name.|فجأة، نادى صوت مألوف اسمه.|suddenly=فجأة؛ familiar=مألوف، معروف
“Daniel!”|“دانيال!”|
He turned around at once, within a split second.|التفت فورًا، في أقل من جزء من الثانية.|at once=فورًا، في الحال؛ within a split second=في جزء من الثانية
There she was, standing close to him, her eyes brimming with tears.|كانت هناك، واقفة قربه، وعيناها تفيضان بالدموع.|brimming with=تفيض بـ، ممتلئة بـ
For a moment, neither of them spoke.|للحظة، لم يتكلم أي منهما.|neither=لا هذا ولا ذاك، لا أحد من الاثنين
The station became completely quiet and silent.|وساد المحطة هدوء وسكون تام.|quiet=هادئ
“I thought I had lost you forever,” Daniel said.|“ظننتُ أنني فقدتكِ إلى الأبد،” قال دانيال.|forever=إلى الأبد
Lily smiled and replied, “Sometimes life separates people, but it cannot always destroy the memories that connect them.”|ابتسمت ليلي وردّت: “أحيانًا تفرّق الحياة بين الناس، لكنها لا تستطيع دائمًا تدمير الذكريات التي تربط بينهم.”|destroy=يدمّر، يهدم؛ connect=يربط، يصل

Daniel did not complain or blame her.|لم يشتكِ دانيال ولم يلمها.|complain=يشتكي؛ blame=يلوم، يُحمّل المسؤولية
Instead, he tried to show understanding and sympathy and make allowances for everything she had endured.|بل حاول أن يُظهر التفهّم والتعاطف وأن يلتمس العذر لكل ما تحمّلته.|sympathy=تعاطف، مواساة
They finally embraced.|وأخيرًا تعانقا.|embrace=يعانق، يحتضن
Their long-awaited reunion had become a reality.|وصار لقاؤهما الذي طال انتظاره حقيقة.|long-awaited=طال انتظاره؛ reality=حقيقة واقعة
And as the train slowly disappeared into the distance, Daniel understood something extraordinary:|وبينما اختفى القطار ببطء في البعيد، أدرك دانيال شيئًا استثنائيًا:|in the distance=من بعيد، في الأفق؛ extraordinary=استثنائي، خارق للعادة
Some people are so special that their absence cannot be measured by time, and some reunions are worth every moment of waiting.|بعض الناس مميزون لدرجة أن غيابهم لا يُقاس بالزمن، وبعض اللقاءات تستحق كل لحظة انتظار.|absence=غياب؛ measure=يقيس؛ worth=يستحق، جدير بـ`},

{t:"The Man Who Returned at Dawn",x:`At early morning, when the first rays of sunlight touched the old harbor, a stranger arrived in a small town after twenty years of absence.|في الصباح الباكر، حين لامست أولى أشعة الشمس الميناء القديم، وصل غريب إلى بلدة صغيرة بعد غياب عشرين عامًا.|rays=أشعة؛ harbor=ميناء، مرفأ؛ touch=يلامس، يمسّ
His appearance and look had changed considerably.|لقد تغيّر مظهره وهيئته كثيرًا.|appearance=مظهر، هيئة؛ look=هيئة، شكل؛ considerably=إلى حد كبير، بشكل ملحوظ
His hair was gray, his moustache and beard were thick, and his face carried the marks of a man who had witnessed many changes in life.|كان شعره رماديًا، وشاربه ولحيته كثيفين، وحمل وجهه آثار رجل شهد تغيّرات كثيرة في الحياة.|gray=رمادي؛ moustache=شارب؛ beard=لحية؛ thick=كثيف، سميك؛ witness=يشهد، يعاصر

He walked through the narrow streets, looking at the familiar buildings.|مشى عبر الشوارع الضيقة ينظر إلى المباني المألوفة.|narrow=ضيق؛ buildings=مبانٍ
An old shopkeeper stood outside his store and began to size him up, looking him up and down carefully.|وقف صاحب متجر عجوز خارج متجره وبدأ يقيّمه، يتفحصه من رأسه إلى قدميه بعناية.|shopkeeper=صاحب متجر؛ size up=يقيّم، يتفحّص؛ look up and down=ينظر من الرأس إلى القدم؛ carefully=بعناية، بحذر
“Are you Daniel?” the shopkeeper asked.|“هل أنت دانيال؟” سأل صاحب المتجر.|
Daniel nodded. “Yes. I have returned.”|أومأ دانيال برأسه: “نعم. لقد عدت.”|nod=يومئ برأسه؛ return=يعود، يرجع

The shopkeeper looked at him head-on, almost unable to believe his eyes.|نظر إليه صاحب المتجر وجهًا لوجه، وكاد لا يصدّق عينيه.|head-on=وجهًا لوجه، مباشرة؛ almost=كاد، تقريبًا
His voice was hesitant.|كان صوته متردّدًا.|hesitant=متردد، مرتبك
“After all these years? What brings you back?”|“بعد كل هذه السنين؟ ما الذي أعادك؟”|what brings you back=ما الذي أعادك؟
Daniel smiled faintly. “I have unfinished business here.”|ابتسم دانيال ابتسامة خفيفة: “لديّ أمور لم تنتهِ هنا.”|faintly=بخفّة، بشكل خافت؛ unfinished business=أمور عالقة لم تُحسم

He entered the old tailor’s shop, where his father had once worked as a tailor.|دخل محل الخياط القديم، حيث عمل والده يومًا خياطًا.|tailor=خيّاط؛ once=ذات يوم، في وقت سابق
The place looked almost the same, although the furniture was worn out.|بدا المكان تقريبًا كما كان، رغم أن الأثاث كان بالِيًا.|furniture=أثاث؛ worn out=بالٍ، متهالك؛ although=رغم أن
A young assistant was rubbing his hands nervously while waiting for customers.|كان مساعد شاب يفرك يديه بتوتر وهو ينتظر الزبائن.|assistant=مساعد؛ rub=يفرك، يدلك؛ nervously=بتوتر، بعصبية؛ customers=زبائن
“Could I ask you a favor?” Daniel said.|“هل يمكنني أن أطلب منك معروفًا؟” قال دانيال.|ask a favor=يطلب معروفًا
“I need you to help me find someone.”|“أحتاج أن تساعدني في العثور على شخص.”|
“Who are you looking for?”|“عمّن تبحث؟”|
“My former friend, Edward. He was the original owner of this shop.”|“صديقي السابق إدوارد. كان المالك الأصلي لهذا المحل.”|former=سابق؛ original=أصلي، أول؛ owner=مالك

The assistant hesitated before answering.|تردّد المساعد قبل أن يجيب.|
“You should be careful. Edward has a reputation in this town, and not all of it is good.”|“يجب أن تكون حذرًا. لإدوارد سمعة في هذه البلدة، وليست كلها جيدة.”|careful=حذر، متنبّه؛ reputation=سمعة
Daniel had always been sincere and honest.|كان دانيال دائمًا مخلصًا وصادقًا.|sincere=مخلص، صادق، نزيه
He had never intended to deceive anyone or cheat them.|لم ينوِ يومًا خداع أحد أو غشّه.|intend=ينوي، يقصد؛ deceive=يخدع، يضلّل؛ cheat=يغشّ، يحتال على
Yet he knew that some people had lost their face and reputation because of Edward’s actions.|ومع ذلك كان يعرف أن بعض الناس فقدوا ماء وجههم وسمعتهم بسبب أفعال إدوارد.|yet=ومع ذلك، لكن؛ lose face=يفقد ماء الوجه، يتعرض للإهانة؛ actions=أفعال، تصرفات

During his years abroad, Daniel had worked exceedingly hard.|خلال سنوات غربته، عمل دانيال بجهد بالغ.|abroad=في الخارج، في الغربة؛ exceedingly=للغاية، بشكل مفرط
He had earned an academic degree and eventually became a first-class engineer.|نال شهادة أكاديمية، وأصبح في النهاية مهندسًا من الطراز الأول.|earn=ينال، يكسب؛ academic degree=شهادة أكاديمية؛ eventually=في النهاية، بمرور الوقت؛ first-class=من الدرجة الأولى؛ engineer=مهندس
He had also become the mainstay and backbone of a large company, working under a responsible manager with the help of a capable assistant.|وأصبح أيضًا عماد شركة كبيرة وعمودها الفقري، يعمل تحت إدارة مدير مسؤول بمساعدة مساعد كفء.|mainstay=عماد، ركيزة أساسية؛ backbone=عمود فقري، سند؛ responsible=مسؤول، موثوق؛ capable=كفء، قادر
But success had never made him forget his hometown.|لكن النجاح لم يُنسِه مسقط رأسه أبدًا.|success=نجاح؛ forget=ينسى
He was still as ever concerned about his family and the people who had supported him.|وظلّ كما كان دائمًا مهتمًا بعائلته وبمن دعموه.|concerned about=مهتم بـ، قلق على؛ support=يدعم، يسند

At least once a year, he would call his mother, using the old telephone number he had memorized.|مرة في السنة على الأقل، كان يتصل بأمه مستخدمًا رقم الهاتف القديم الذي حفظه.|at least=على الأقل؛ memorize=يحفظ عن ظهر قلب
His voice always carried a faint and indistinct accent, a mixture of his original language and the foreign country where he had lived.|كان صوته يحمل دائمًا لكنة خفيفة غير واضحة، مزيجًا من لغته الأصلية والبلد الأجنبي الذي عاش فيه.|faint=خافت، ضعيف؛ indistinct=غير واضح، مبهم؛ accent=لكنة؛ mixture=مزيج، خليط؛ foreign=أجنبي، غريب
He was too proud to flaunt his achievements or show off his wealth.|كان أكثر كبرياءً من أن يتباهى بإنجازاته أو يستعرض ثروته.|proud=فخور، معتزّ بنفسه؛ flaunt=يتباهى بـ، يعرض بفخر؛ show off=يستعرض، يتفاخر؛ achievements=إنجازات؛ wealth=ثروة
He preferred to live a gentle and refined life, treating everyone with respect.|فضّل أن يعيش حياة هادئة راقية، يعامل الجميع باحترام.|prefer=يفضّل؛ refined=راقٍ، مهذّب؛ treat=يعامل، يتصرف مع

That afternoon, Daniel finally found Edward near the harbor.|بعد ظهر ذلك اليوم، وجد دانيال إدوارد أخيرًا قرب الميناء.|
Edward was wearing a magnificent suit, with a splendid and bright watch on his wrist.|كان إدوارد يرتدي بدلة فاخرة، وفي معصمه ساعة رائعة لامعة.|magnificent=فاخر، عظيم، مهيب؛ suit=بدلة؛ splendid=رائع، باهر؛ bright=لامع، ساطع؛ wrist=معصم
His appearance was delightful, but something about his behavior seemed strange.|كان مظهره جذابًا، لكن شيئًا في تصرفه بدا غريبًا.|delightful=جذاب، مبهج؛ behavior=تصرف، سلوك؛ strange=غريب، مريب
Edward looked Daniel up and down.|نظر إدوارد إلى دانيال من رأسه إلى قدميه.|
“Well, well! The successful man has finally returned!”|“حسنًا حسنًا! عاد الرجل الناجح أخيرًا!”|well, well=حسنًا حسنًا (للتهكم أو الدهشة)
Daniel replied calmly, “I didn’t come here to impress anyone.”|ردّ دانيال بهدوء: “لم آتِ إلى هنا لأُبهر أحدًا.”|calmly=بهدوء، بتروٍّ؛ impress=يُبهر، يترك انطباعًا
Edward laughed. “You have become exceedingly successful. I hope you haven’t forgotten who you used to be.”|ضحك إدوارد: “لقد أصبحت ناجحًا جدًا. آمل ألا تكون قد نسيت من كنتَ.”|

Daniel looked him straight in the eyes.|نظر دانيال في عينيه مباشرة.|straight=مباشرة، بشكل مستقيم
“I remember everything. I remember the promises, the lies, and the people you let down.”|“أتذكر كل شيء. أتذكر الوعود والأكاذيب والناس الذين خذلتهم.”|lies=أكاذيب، أكاذيب؛ let down=يخذل، يخيّب أمل
Edward’s smile disappeared.|اختفت ابتسامة إدوارد.|
Daniel continued, “You deceived my father and failed to live up to your promises.|واصل دانيال: “خدعتَ أبي ولم تفِ بوعودك.|continue=يواصل، يستمر؛ fail=يفشل، يخفق؛ live up to=يفي بـ، يرقى إلى مستوى
You made him lose his reputation, and you disgraced our family.”|جعلته يفقد سمعته، وأخزيتَ عائلتنا.”|disgrace=يُخزي، يجلب العار على
Edward tried to defend himself, but Daniel had come with evidence.|حاول إدوارد الدفاع عن نفسه، لكن دانيال جاء ومعه الدليل.|defend=يدافع عن؛ evidence=دليل، إثبات

He placed an old document on the table with utmost care, almost gingerly, as if it were a priceless treasure.|وضع وثيقة قديمة على الطاولة بعناية فائقة، وبحذر شديد تقريبًا، كأنها كنز لا يُقدَّر بثمن.|place=يضع، يُنزل؛ document=وثيقة، مستند؛ utmost=أقصى، فائق؛ gingerly=بحذر شديد، برفق؛ priceless=لا يُقدَّر بثمن
The document revealed Edward’s original intention and proved that he had cheated Daniel’s father many years ago.|كشفت الوثيقة نية إدوارد الأصلية وأثبتت أنه غشّ والد دانيال قبل سنوات كثيرة.|reveal=يكشف، يُظهر؛ intention=نيّة، قصد؛ prove=يثبت
Edward’s face turned pale.|شحب وجه إدوارد.|turn pale=يشحب، يصفرّ وجهه
“Where did you get this?” he whispered.|“من أين حصلت على هذا؟” همس.|
“From the person who kept it safe all these years.”|“من الشخص الذي حفظها بأمان طوال هذه السنين.”|keep safe=يحفظ بأمان
For a moment, neither man spoke. The sound of waves filled the harbor.|للحظة، لم يتكلم أي من الرجلين. وملأ صوت الأمواج الميناء.|waves=أمواج؛ fill=يملأ

Daniel finally said, “I don’t want revenge. I only hope you will admit the truth and restore what you took.”|قال دانيال أخيرًا: “لا أريد الانتقام. آمل فقط أن تعترف بالحقيقة وتعيد ما أخذته.”|revenge=انتقام، ثأر؛ admit=يعترف، يقرّ؛ truth=حقيقة؛ restore=يعيد، يردّ
Edward lowered his head.|خفض إدوارد رأسه.|lower=يخفض، ينزل
For the first time, he understood that a person’s true reputation was not built through expensive clothes, impressive degrees, or magnificent possessions.|وللمرة الأولى فهم أن السمعة الحقيقية للإنسان لا تُبنى بالملابس الغالية أو الشهادات المبهرة أو الممتلكات الفاخرة.|expensive=غالٍ، باهظ؛ impressive=مبهر، مؤثر؛ possessions=ممتلكات، مقتنيات؛ built=يُبنى
It was built through sincerity, honesty, and the way one treated others.|بل كانت تُبنى بالإخلاص والأمانة وطريقة معاملة المرء للآخرين.|sincerity=إخلاص، صدق؛ honesty=أمانة، صدق
And as the sun disappeared behind the harbor, Daniel realized that returning home was not about showing the world how successful he had become.|وبينما غابت الشمس خلف الميناء، أدرك دانيال أن العودة إلى الوطن لم تكن لإظهار مدى نجاحه للعالم.|
It was about finding the truth, protecting his family’s dignity, and finally making peace with the past.|بل كانت للعثور على الحقيقة، وحماية كرامة عائلته، وإحلال السلام مع الماضي أخيرًا.|protect=يحمي، يصون؛ dignity=كرامة، اعتزاز؛ make peace with=يتصالح مع`},
{t:"The Man Who Refused to Surrender",x:`One evening, as the sun was setting over a small village, a young man named Adam was walking along a flat road near an abandoned factory.|في مساء أحد الأيام، بينما كانت الشمس تغرب فوق قرية صغيرة، كان شاب اسمه آدم يمشي على طريق مستوٍ قرب مصنع مهجور.|set=تغرب (الشمس)، يضع؛ flat=مستوٍ، مسطّح؛ abandoned=مهجور، متروك؛ factory=مصنع
He was tired of his miserable life and had grown to detest the cruel people who controlled the village.|كان قد سئم حياته البائسة وصار يمقت الناس القساة الذين يسيطرون على القرية.|tired of=سئم من، ضجر من؛ miserable=بائس، تعيس؛ detest=يمقت، يكره بشدة؛ cruel=قاسٍ، ظالم؛ control=يتحكم في، يسيطر على

Adam was not a careless or foolish guy.|لم يكن آدم شخصًا مهملًا أو أحمق.|careless=مهمل، طائش؛ foolish=أحمق، غبي؛ guy=شخص، واحد (عامية)
He had a sharp mind and a strong conscience.|كان يتمتع بعقل حاد وضمير قوي.|sharp=حاد، ذكي؛ conscience=ضمير
He had promised his father that he would never surrender to injustice, even if he had to struggle alone.|كان قد وعد أباه بأنه لن يستسلم أبدًا للظلم، حتى لو اضطر إلى الكفاح وحده.|injustice=ظلم، جور؛ struggle=يكافح، يناضل

Unexpectedly, he heard a strange noise behind him.|وعلى غير توقع، سمع ضجة غريبة خلفه.|unexpectedly=على غير توقع، فجأة؛ noise=ضجيج، صوت عالٍ
He turned around and saw a group of hoodlums approaching.|التفت ورأى مجموعة من البلطجية يقتربون.|hoodlums=بلطجية، قطاع طرق، مجرمون
Their leader was a hateful and ruthless fellow who looked down upon everyone weaker than himself.|كان زعيمهم رجلًا بغيضًا قاسي القلب يحتقر كل من هو أضعف منه.|hateful=بغيض، مكروه؛ ruthless=عديم الرحمة، قاسي القلب؛ fellow=رجل، شخص، زميل؛ look down upon=يحتقر، ينظر باستعلاء إلى

“Hey, chap! What are you doing here?” the leader shouted.|“أنت يا فتى! ماذا تفعل هنا؟” صاح الزعيم.|chap=يا فتى، يا رجل (عامية بريطانية)
Adam fixed his eyes on him.|ثبّت آدم عينيه عليه.|fix one’s eyes on=يثبّت عينيه على، يحدّق في
There was something unusual in his look.|كان في نظرته شيء غير معتاد.|
His eyes showed anger, but he remained calm.|أظهرت عيناه الغضب، لكنه ظل هادئًا.|anger=غضب
“Get out of my way,” Adam replied.|“ابتعد عن طريقي،” ردّ آدم.|get out of my way=ابتعد عن طريقي، أفسح لي الطريق

The leader laughed and took a bullet out of his pocket.|ضحك الزعيم وأخرج رصاصة من جيبه.|bullet=رصاصة؛ pocket=جيب
Adam began to breathe deeply, trying to control his fear.|بدأ آدم يتنفس بعمق محاولًا السيطرة على خوفه.|breathe=يتنفس؛ deeply=بعمق؛ fear=خوف
He knew that resisting these men would be dangerous, but he refused to flee.|كان يعرف أن مقاومة هؤلاء الرجال ستكون خطيرة، لكنه رفض الفرار.|resist=يقاوم، يتصدى لـ؛ dangerous=خطير؛ flee=يفرّ، يهرب
“If you think you can frighten me, you’re wrong,” Adam said.|“إن كنت تظن أنك تستطيع إخافتي، فأنت مخطئ،” قال آدم.|frighten=يخيف، يرعب

{t:"The Power of Determination",x:`Adam was always itching to do something meaningful with his life.|كان آدم دائمًا متلهفًا لأن يفعل شيئًا ذا معنى في حياته.|

{t:"The Road to Leadership",x:`When Michael took office as the new manager of a large international company, he knew that the position would not be easy.|عندما تولّى مايكل منصبه مديرًا جديدًا لشركة دولية كبيرة، كان يعرف أن المنصب لن يكون سهلًا.|take office=يتولى المنصب؛ international=دولي، عالمي؛ position=منصب، وظيفة

Michael decided to go all out to improve the workplace.|قرر مايكل أن يبذل أقصى جهده لتحسين مكان العمل.|go all out=يبذل أقصى جهد، يُسخّر كل طاقته

He would keep account of every employee’s achievements and evaluate their performance regularly.|سيتتبع إنجازات كل موظف ويقيّم أداءه بانتظام.|keep account of=يتتبع، يحتفظ بسجل لـ؛ regularly=بانتظام

However, he understood that leadership was not about showing authority or boasting about one’s talent.|غير أنه أدرك أن القيادة ليست إظهار السلطة أو التباهي بالموهبة.|authority=سلطة، نفوذ؛ boasting=يتباهى، يفاخر
It was about helping others develop their abilities.|بل هي مساعدة الآخرين على تطوير قدراتهم.|develop=يطوّر، ينمّي
He refused to slight or cold-shoulder anyone.|رفض أن يستخف بأحد أو يعامله ببرود.|slight=يستخف بـ، يزدري؛ cold-shoulder=يعامل ببرود، يتجاهل عمدًا
Even when employees made mistakes, he preferred to teach them rather than bully them.|حتى حين أخطأ الموظفون، فضّل تعليمهم بدلًا من التنمر عليهم.|rather than=بدلًا من، عوضًا عن

Some supervisors, however, were perfunctory in their duties.|بعض المشرفين، مع ذلك، كانوا سطحيين في أداء واجباتهم.|supervisors=مشرفون؛ perfunctory=شكلي، سطحي، من باب الواجب؛ duties=واجبات، مهام
They would slight over important details and make do with incomplete reports.|كانوا يتجاوزون التفاصيل المهمة ويكتفون بتقارير ناقصة.|slight over=يتجاوز بإهمال، يمرّ مرور الكرام؛ details=تفاصيل؛ make do with=يكتفي بـ، يتدبر بما هو متاح؛ incomplete=ناقص، غير مكتمل؛ reports=تقارير
Michael warned them that such behavior would not be accepted.|حذّرهم مايكل من أن هذا السلوك لن يُقبل.|warned=حذّر؛ accepted=يُقبل

He encouraged every department to try every means possible to improve productivity and do everything possible to achieve its annual targets.|شجّع كل قسم على بذل كل وسيلة ممكنة لتحسين الإنتاجية وفعل كل ما هو ممكن لتحقيق أهدافه السنوية.|department=قسم، إدارة؛ try every means=يجرّب كل الوسائل؛ productivity=إنتاجية؛ annual=سنوي
He also introduced training sessions to put employees’ talents to good use and give full play to their abilities.|كما أدخل جلسات تدريبية للاستفادة من مواهب الموظفين وإطلاق العنان لقدراتهم.|introduce=يقدّم، يُدخل؛ sessions=جلسات؛ put to good use=يستفيد من، يوظّف جيدًا؛ give full play to=يطلق العنان لـ، يستثمر بالكامل

One day, a serious problem appeared.|في يوم ما، ظهرت مشكلة خطيرة.|serious=خطير، جاد
A major business partner complained that the company had failed to deliver an important order on time.|اشتكى شريك تجاري رئيسي من أن الشركة أخفقت في تسليم طلب مهم في موعده.|major=رئيسي، كبير؛ deliver=يسلّم، يوصّل؛ order=طلبية، طلب؛ on time=في الموعد، في الوقت المحدد
Michael immediately checked the records and discovered that one department had neglected its responsibilities.|فحص مايكل السجلات فورًا واكتشف أن أحد الأقسام قد أهمل مسؤولياته.|checked=فحص، تحقّق؛ records=سجلات

He did not leap to conclusions.|لم يتسرّع في استخلاص النتائج.|leap to conclusions=يقفز إلى الاستنتاجات، يتسرع في الحكم
Instead, he carefully examined the situation and listened to both sides.|بل فحص الموقف بعناية واستمع إلى الطرفين.|both sides=الطرفان، كلا الجانبين
His cautious and conscientious personality helped him find the real cause of the problem.|ساعدته شخصيته الحذرة والمدقِّقة على إيجاد السبب الحقيقي للمشكلة.|cautious=حذر، متحفظ؛ conscientious=دقيق، ضميري، مخلص في عمله؛ cause=سبب

He worked passionately to solve it, dedicating himself to work even during the busiest hours.|عمل بشغف لحلها، مكرِّسًا نفسه للعمل حتى في أكثر الساعات انشغالًا.|passionately=بشغف، بحماس شديد؛ dedicating himself to=يكرّس نفسه لـ، يتفانى في
His employees were surprised to see their manager making tea and coffee for the exhausted team, filling the office with a warmer atmosphere.|دُهش موظفوه لرؤية مديرهم يُعدّ الشاي والقهوة للفريق المنهك، مما ملأ المكتب بجوّ أدفأ.|surprised=مندهش، متفاجئ
“Leadership is not a title,” he told them. “It is a responsibility.”|“القيادة ليست لقبًا،” قال لهم. “إنها مسؤولية.”|title=لقب، مسمّى وظيفي

After several months, the company’s performance improved significantly.|بعد عدة أشهر، تحسّن أداء الشركة بشكل ملحوظ.|significantly=بشكل ملحوظ، بدرجة كبيرة
Employees began to trust one another, and the general atmosphere became much healthier.|بدأ الموظفون يثقون ببعضهم، وصار الجو العام أكثر صحة بكثير.|healthier=أكثر صحة، أسلم
At the end of the year, the board evaluated Michael’s performance.|في نهاية العام، قيّم مجلس الإدارة أداء مايكل.|board=مجلس الإدارة
His achievements exceeded the expected norms and targets.|تجاوزت إنجازاته المعايير والأهداف المتوقعة.|exceeded=تجاوز، فاق؛ norms=معايير، أعراف
He had not only improved productivity but also established a culture of fairness and cooperation.|لم يحسّن الإنتاجية فحسب، بل أسس أيضًا ثقافة من العدل والتعاون.|culture=ثقافة؛ cooperation=تعاون
The board decided to promote him to a higher position.|قرر مجلس الإدارة ترقيته إلى منصب أعلى.|promote=يرقّي، يروّج

When Michael assumed office as the company’s regional director, he remembered the veteran employees who had taught him everything.|عندما تولّى مايكل منصب المدير الإقليمي للشركة، تذكّر الموظفين المخضرمين الذين علّموه كل شيء.|assumed office=تولّى المنصب؛ regional=إقليمي؛ director=مدير
He knew that his success was not his achievement alone.|كان يعرف أن نجاحه ليس إنجازه وحده.|
He decided to repay their kindness by giving young employees the same opportunities he had once received.|قرر أن يردّ جميلهم بمنح الموظفين الشباب الفرص نفسها التي نالها يومًا.|repay=يردّ (الجميل)، يسدّد؛ opportunities=فرص
His story proved that true leadership required passion, talent, justice, and the ability to put people first.|أثبتت قصته أن القيادة الحقيقية تتطلب الشغف والموهبة والعدل والقدرة على وضع الناس أولًا.|passion=شغف، حماس عارم`},
{t:"A Decision That Changed Everything",x:`Daniel had always been good at making decisions.|كان دانيال دائمًا بارعًا في اتخاذ القرارات.|good at=بارع في، ماهر في
He was a wise and brilliant young man who believed that everyone should have the courage to make their own choices.|كان شابًا حكيمًا ولامعًا يؤمن بأن على كل إنسان أن يمتلك الشجاعة ليتخذ اختياراته بنفسه.|wise=حكيم، عاقل؛ brilliant=لامع، عبقري؛ choices=اختيارات
However, he had one weakness: he was sometimes irritable, impatient, and easily worried about the future.|ومع ذلك كانت لديه نقطة ضعف واحدة: كان أحيانًا سريع الانفعال وقليل الصبر ويقلق بسهولة على المستقبل.|weakness=نقطة ضعف؛ irritable=سريع الانفعال، عصبي؛ impatient=نافد الصبر؛ worried=قلق

After graduating from university, Daniel found employment at a finance and banking company.|بعد تخرجه من الجامعة، وجد دانيال عملًا في شركة تمويل وبنوك.|finance=تمويل، مالية؛ banking=عمل مصرفي، بنوك
He was an expert in financial analysis and was particularly good at calculating costs, predicting risks, and making accurate reports.|كان خبيرًا في التحليل المالي وبارعًا خصوصًا في حساب التكاليف والتنبؤ بالمخاطر وإعداد تقارير دقيقة.|expert=خبير؛ analysis=تحليل؛ particularly=خصوصًا، على وجه الخصوص؛ calculating=يحسب؛ costs=تكاليف؛ predicting=يتنبأ بـ؛ risks=مخاطر؛ accurate=دقيق
His manager often said, “Daniel has a sharp mind and an inborn talent for business. He is exactly the kind of employee this company needs.”|كان مديره يقول كثيرًا: “لدى دانيال عقل حاد وموهبة فطرية في الأعمال. إنه بالضبط نوع الموظف الذي تحتاجه هذه الشركة.”|inborn=فطري، موروث؛ exactly=بالضبط، تمامًا
